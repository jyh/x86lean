# CAV 2027 artifact, stage 1 (STATUS-paris row 63, act 3 (a)): build the linux/amd64 image on a hosted runner and
# MEASURE the cold Lean build inside it (wall time, peak RSS, image size). Read-only for the repository; it publishes
# nothing (the image is kept as a workflow artifact for 7 days, never pushed to a registry).
name: artifact-image
on:
  workflow_dispatch:
  push:
    branches: [paris/o38-artifact]
    paths: [artifact/**, .github/workflows/artifact-image.yml, '!artifact/README.md']
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # check_claims re-derives each figure at the commit it names
      - name: Build the image (no credentials; public downloads only)
        run: |
          start=$(date +%s)
          docker build --progress=plain --platform linux/amd64 -f artifact/Dockerfile -t x86lean-artifact:stage1 . 2>&1 | tee /tmp/dbuild.log; test ${PIPESTATUS[0]} -eq 0
          echo "MEASURE docker-build secs=$(( $(date +%s) - start ))"
      - name: Cold Lean build inside the image, timed, at LEAN_NUM_THREADS=2 (a laptop-shaped setting)
        run: |
          echo "MEASURE runner nproc=$(nproc) mem_kb=$(awk '/MemTotal/{print $2}' /proc/meminfo)"
          docker run --rm -e LEAN_NUM_THREADS=2 x86lean-artifact:stage1
      - name: The axiom gate and the claims manifest inside the image
        run: |
          docker run --rm -e LEAN_NUM_THREADS=2 x86lean-artifact:stage1 bash -c 'python3 scripts/lean_route.py build >/dev/null 2>&1; s=$(date +%s); bash scripts/axiom_gate.sh > /tmp/ax.log 2>&1; r=$?; echo "MEASURE axiom-gate rc=$r secs=$(( $(date +%s) - s ))"; tail -2 /tmp/ax.log; s=$(date +%s); python3 scripts/check_claims.py > /tmp/cc.log 2>&1; r=$?; echo "MEASURE check-claims rc=$r secs=$(( $(date +%s) - s ))"; tail -1 /tmp/cc.log'
      - name: The FULL differential inside the image, stage by stage
        run: docker run --rm -e LEAN_NUM_THREADS=2 x86lean-artifact:stage1 bash artifact/measure-diff.sh
      - name: Image size, as a reviewer would download it
        run: |
          docker save x86lean-artifact:stage1 | gzip -1 > image.tar.gz
          echo "MEASURE image-tar-gz bytes=$(stat -c %s image.tar.gz)"
