name: hwprobe

# THE x86-64 REFEREE (D266). Sub-group B pins some rows in the kernel against the SDM where ACL2 x86isa
# disagrees: the sign of the QNaN floating-point indefinite (D265), and COMIS* raising IE on a QNaN (x86isa
# dispatches COMIS as UCOMIS). The development machine is arm64 and cannot referee either. A hosted
# runner is x86-64, so this job runs each row's instruction on its processor and compares the result and
# the MXCSR sticky flags with expectations hwprobe/mk_rows.py derives from the SDM's rules.
#
# ⚠️ ADVISORY and PATH-FILTERED. It is not a required check, so the filter cannot hang a merge; it runs when
# the probe or this file changes, and on demand. The processor it ran on is printed first, because a
# reading of "the hardware" is a reading of ONE processor.

on:
  push:
    paths: ['hwprobe/**', '.github/workflows/hwprobe.yml']
  pull_request:
    paths: ['hwprobe/**', '.github/workflows/hwprobe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  referee:
    # ⭐ TWO VENDORS (D267), BUT ONLY PER RUN. The documentation names no processor for ubuntu-latest: it drew an
    # AMD EPYC 7763 on D266 §5's and D269's runs, and an Intel Xeon Platinum 8370C on D272's first. `macos-15-intel`
    # is documented as Intel. So a second VENDOR is a property of a run whose Linux leg drew AMD, and the record
    # names the processor each leg printed, never the label.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ⛔ A TRANSLATED PROCESS ALSO SAYS x86_64. On an Apple-silicon host under Rosetta 2, `uname -m`
      # reports x86_64, and Rosetta agreed with every row here (D266 §5) — as an EMULATOR. So the job
      # refuses to referee unless the machine is x86-64 AND the process is not translated.
      - name: The processor
        run: |
          uname -m
          test "$(uname -m)" = x86_64
          if [ -r /proc/cpuinfo ]; then
            grep -m1 'model name' /proc/cpuinfo
            grep -m1 -ow sse2 /proc/cpuinfo
          else
            sysctl -n machdep.cpu.brand_string
            sysctl -n machdep.cpu.features | tr ' ' '\n' | grep -x SSE2
            test "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" = 0
          fi
          # D330: the integer path needs BMI2 (MULX) and ADX (ADCX/ADOX). Printed here as the OS reports them;
          # int_probe reads CPUID leaf 7 itself and REFUSES (exit 2) if either is absent, so this is a record, not
          # the guard.
          # D334 adds BMI1 (ANDN, BEXTR, BLSMSK, BLSR); int_probe reads CPUID itself and refuses without BMI1, BMI2, ADX or SSE2.
          if [ -r /proc/cpuinfo ]; then
            grep -m1 -ow bmi1 /proc/cpuinfo || echo "bmi1: NOT REPORTED"
            grep -m1 -ow bmi2 /proc/cpuinfo || echo "bmi2: NOT REPORTED"
            grep -m1 -ow adx /proc/cpuinfo || echo "adx: NOT REPORTED"
          else
            sysctl -n machdep.cpu.leaf7_features | tr ' ' '\n' | grep -x -e BMI1 -e BMI2 -e ADX || echo "BMI1/BMI2/ADX: NOT REPORTED"
          fi
          # D336: the shuffle path (and D335's PMADDUBSW, PMULHRSW) needs SSSE3 (PSHUFB, PALIGNR) and SSE4.1 (PINSRD/Q, PEXTRD/Q); shuf_probe and simda_probe read CPUID
          # themselves and refuse without what they need, so this is a record, not the guard.
          if [ -r /proc/cpuinfo ]; then
            grep -m1 -ow ssse3 /proc/cpuinfo || echo "ssse3: NOT REPORTED"
            grep -m1 -ow sse4_1 /proc/cpuinfo || echo "sse4_1: NOT REPORTED"
          else
            sysctl -n machdep.cpu.features | tr ' ' '\n' | grep -x -e SSSE3 -e SSE4.1 || echo "SSSE3/SSE4.1: NOT REPORTED"
          fi
          # D338: the SHA-NI path needs SHA (CPUID.(EAX=07H,ECX=0):EBX bit 29). sha_probe reads CPUID itself and refuses
          # with its OWN exit code (3) without it, so this is a record, not the guard.
          if [ -r /proc/cpuinfo ]; then
            grep -m1 -ow sha_ni /proc/cpuinfo || echo "sha_ni: NOT REPORTED"
          else
            sysctl -n machdep.cpu.leaf7_features | tr ' ' '\n' | grep -x SHA || echo "SHA: NOT REPORTED"
          fi
          # D342: the AES path needs AES-NI, PCLMULQDQ and AVX (CPUID.01H:ECX bits 25, 1, 28, with OSXSAVE and XCR0's SSE
          # and AVX state). aes_probe reads CPUID and XCR0 itself and refuses (exit 3) without them, so this is a record.
          if [ -r /proc/cpuinfo ]; then
            grep -m1 -ow -e aes -e pclmulqdq -e avx /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          else
            sysctl -n machdep.cpu.features | tr ' ' '\n' | grep -x -e AES -e PCLMULQDQ -e AVX1.0 || echo "AES/PCLMULQDQ/AVX: NOT REPORTED"
          fi

      - name: Rows, derived from the rules (never typed)
        working-directory: hwprobe
        run: |
          python3 ref_mul.py
          python3 mk_rows.py > rows.h
          python3 mk_rows.py --plant > rows_plant.h
          python3 mk_rows.py --plant-op > rows_badop.h
          python3 mk_rows.py --plant-packed > rows_pplant.h
          python3 mk_rows.py --plant-pop > rows_pbadop.h
          python3 mk_int_rows.py > int_rows.h
          python3 mk_int_rows.py --plant > int_rows_plant.h
          python3 mk_int_rows.py --plant-op > int_rows_badop.h
          python3 mk_int_rows.py --plant-new > int_rows_plantnew.h
          python3 mk_bitstr_rows.py > bitstr_rows.h
          python3 mk_bitstr_rows.py --plant > bitstr_rows_plant.h
          python3 mk_bitstr_rows.py --plant-mem > bitstr_rows_pmem.h
          python3 mk_bitstr_rows.py --plant-stray > bitstr_rows_stray.h
          python3 mk_bitstr_rows.py --plant-op > bitstr_rows_badop.h
          python3 mk_shuf_rows.py > shuf_rows.h
          python3 mk_shuf_rows.py --plant > shuf_rows_plant.h
          python3 mk_shuf_rows.py --plant-op > shuf_rows_badop.h
          python3 mk_shuf_rows.py --plant-zx > shuf_rows_zx.h
          python3 mk_shuf_rows.py --plant-mem > shuf_rows_mem.h
          python3 mk_shuf_rows.py --refuse-wrong
          python3 mk_simda_rows.py --reach
          python3 mk_simda_rows.py > simda_rows.h
          python3 mk_simda_rows.py --plant > simda_rows_plant.h
          python3 mk_simda_rows.py --plant-op > simda_rows_badop.h
          python3 mk_simda_rows.py --set-b --reach
          python3 mk_simda_rows.py --set-b > simdb_rows.h
          python3 mk_simda_rows.py --set-b --plant > simdb_rows_plant.h
          python3 mk_simda_rows.py --set-b --plant-op > simdb_rows_badop.h
          python3 mk_simda_rows.py --set-c --reach
          python3 mk_simda_rows.py --set-c > simdc_rows.h
          python3 mk_simda_rows.py --set-c --plant > simdc_rows_plant.h
          python3 mk_simda_rows.py --set-c --plant-op > simdc_rows_badop.h
          python3 mk_sha_rows.py --selftest
          python3 mk_sha_rows.py --reach
          python3 mk_sha_rows.py > sha_rows.h
          python3 mk_sha_rows.py --plant > sha_rows_plant.h
          python3 mk_sha_rows.py --plant-op > sha_rows_badop.h
          python3 mk_sha_rows.py --plant-wk > sha_rows_wk.h
          python3 mk_aes_rows.py --selftest
          python3 mk_aes_rows.py --refuse-wrong
          python3 mk_aes_rows.py --reach
          python3 mk_aes_rows.py > aes_rows.h
          python3 mk_aes_rows.py --plant > aes_rows_plant.h
          python3 mk_aes_rows.py --plant-op > aes_rows_badop.h
          python3 mk_aes_rows.py --plant-hi > aes_rows_hi.h
          python3 mk_vexsil_rows.py --selftest
          python3 mk_vexsil_rows.py --refuse-wrong
          python3 mk_vexsil_rows.py --reach
          python3 mk_vexsil_rows.py > vexsil_rows.h
          python3 mk_vexsil_rows.py --plant > vexsil_rows_plant.h
          python3 mk_vexsil_rows.py --plant-op > vexsil_rows_badop.h
          python3 mk_vexsil_rows.py --plant-hi > vexsil_rows_hi.h
          python3 mk_vexsilb_rows.py --selftest
          python3 mk_vexsilb_rows.py --refuse-wrong
          python3 mk_vexsilb_rows.py --reach
          python3 mk_vexsilb_rows.py > vexsilb_rows.h
          python3 mk_vexsilb_rows.py --plant > vexsilb_rows_plant.h
          python3 mk_vexsilb_rows.py --plant-op > vexsilb_rows_badop.h
          python3 mk_vexsilb_rows.py --plant-hi > vexsilb_rows_hi.h
          python3 mk_vexsilc_rows.py --selftest
          python3 mk_vexsilc_rows.py --refuse-wrong
          python3 mk_vexsilc_rows.py --reach
          python3 mk_vexsilc_rows.py > vexsilc_rows.h
          python3 mk_vexsilc_rows.py --plant > vexsilc_rows_plant.h
          python3 mk_vexsilc_rows.py --plant-op > vexsilc_rows_badop.h
          python3 mk_vexsilc_rows.py --plant-hi > vexsilc_rows_hi.h
          python3 mk_vexsild_rows.py --selftest
          python3 mk_vexsild_rows.py --refuse-wrong
          python3 mk_vexsild_rows.py --reach
          python3 mk_vexsild_rows.py > vexsild_rows.h
          for v in plant plant-op plant-nf plant-a0 plant-f; do
            python3 mk_vexsild_rows.py --$v > vexsild_rows_$v.h
          done
          python3 mk_vexsile_rows.py --selftest
          python3 mk_vexsile_rows.py --refuse-wrong
          python3 mk_vexsile_rows.py --reach
          python3 mk_vexsile_rows.py > vexsile_rows.h
          python3 mk_vexsile_rows.py --plant > vexsile_rows_plant.h
          python3 mk_vexsile_rows.py --plant-op > vexsile_rows_badop.h
          python3 mk_vexsile_rows.py --plant-hi > vexsile_rows_hi.h
          python3 mk_vexsilg_rows.py --selftest
          python3 mk_vexsilg_rows.py --reach
          python3 mk_vexsilg_rows.py > vexsilg_rows.h
          python3 mk_vexsilg_rows.py --plant > vexsilg_rows_plant.h
          python3 mk_vexsilg_rows.py --plant-op > vexsilg_rows_badop.h
          python3 mk_vexsilg_rows.py --plant-hi > vexsilg_rows_hi.h
          python3 mk_vexsilk_rows.py --selftest
          python3 mk_vexsilk_rows.py --reach
          python3 mk_vexsilk_rows.py > vexsilk_rows.h
          python3 mk_vexsilk_rows.py --plant > vexsilk_rows_plant.h
          python3 mk_vexsilk_rows.py --plant-op > vexsilk_rows_badop.h
          python3 mk_vexsilk_rows.py --plant-hi > vexsilk_rows_hi.h
          python3 mk_vexsilf_rows.py --selftest
          python3 mk_vexsilf_rows.py --refuse-wrong
          python3 mk_vexsilf_rows.py --reach
          python3 mk_vexsilf_rows.py > vexsilf_rows.h
          python3 mk_vexsilf_rows.py --plant > vexsilf_rows_plant.h
          python3 mk_vexsilf_rows.py --plant-op > vexsilf_rows_badop.h
          python3 mk_vexsilf_rows.py --plant-hi > vexsilf_rows_hi.h
          python3 mk_vexsilf_rows.py --plant-mem > vexsilf_rows_mem.h
          python3 mk_vexsilh_rows.py --selftest
          python3 mk_vexsilh_rows.py --reach
          python3 mk_vexsilh_rows.py > vexsilh_rows.h
          python3 mk_vexsilh_rows.py --plant > vexsilh_rows_plant.h
          python3 mk_vexsilh_rows.py --plant-op > vexsilh_rows_badop.h
          python3 mk_vexsilh_rows.py --plant-hi > vexsilh_rows_hi.h
          python3 mk_vexsilh_rows.py --plant-mem > vexsilh_rows_mem.h
          python3 mk_vexsili_rows.py --selftest
          python3 mk_vexsili_rows.py --reach
          python3 mk_vexsili_rows.py > vexsili_rows.h
          python3 mk_vexsili_rows.py --plant > vexsili_rows_plant.h
          python3 mk_vexsili_rows.py --plant-op > vexsili_rows_badop.h
          python3 mk_vexsili_rows.py --plant-hi > vexsili_rows_hi.h
          python3 mk_vexsili_rows.py --plant-mem > vexsili_rows_mem.h
          python3 mk_vexsilj_rows.py --selftest
          python3 mk_vexsilj_rows.py --reach
          python3 mk_vexsilj_rows.py > vexsilj_rows.h
          python3 mk_vexsilj_rows.py --plant > vexsilj_rows_plant.h
          python3 mk_vexsilj_rows.py --plant-op > vexsilj_rows_badop.h
          python3 mk_vexsilj_rows.py --plant-hi > vexsilj_rows_hi.h
          python3 mk_vexsilj_rows.py --plant-mem > vexsilj_rows_mem.h

      - name: Build
        working-directory: hwprobe
        run: |
          gcc -O1 -o probe probe.c sse_ops.S
          sed 's/"rows.h"/"rows_plant.h"/' probe.c > probe_plant.c
          sed 's/"rows.h"/"rows_badop.h"/' probe.c > probe_badop.c
          gcc -O1 -o probe_plant probe_plant.c sse_ops.S
          gcc -O1 -o probe_badop probe_badop.c sse_ops.S
          sed 's/"rows.h"/"rows_pplant.h"/' probe.c > probe_pplant.c
          sed 's/"rows.h"/"rows_pbadop.h"/' probe.c > probe_pbadop.c
          gcc -O1 -o probe_pplant probe_pplant.c sse_ops.S
          gcc -O1 -o probe_pbadop probe_pbadop.c sse_ops.S
          gcc -O1 -o int_probe int_probe.c int_ops.S
          sed 's/"int_rows.h"/"int_rows_plant.h"/' int_probe.c > int_probe_plant.c
          sed 's/"int_rows.h"/"int_rows_badop.h"/' int_probe.c > int_probe_badop.c
          gcc -O1 -o int_probe_plant int_probe_plant.c int_ops.S
          gcc -O1 -o int_probe_badop int_probe_badop.c int_ops.S
          sed 's/"int_rows.h"/"int_rows_plantnew.h"/' int_probe.c > int_probe_plantnew.c
          gcc -O1 -o int_probe_plantnew int_probe_plantnew.c int_ops.S
          gcc -O1 -o bitstr_probe bitstr_probe.c bitstr_ops.S
          for v in plant pmem stray badop; do
            sed "s/\"bitstr_rows.h\"/\"bitstr_rows_$v.h\"/" bitstr_probe.c > bitstr_probe_$v.c
            gcc -O1 -o bitstr_probe_$v bitstr_probe_$v.c bitstr_ops.S
          done
          gcc -O1 -o shuf_probe shuf_probe.c shuf_ops.S
          for v in plant badop zx mem; do
            sed "s/\"shuf_rows.h\"/\"shuf_rows_$v.h\"/" shuf_probe.c > shuf_probe_$v.c
            gcc -O1 -o shuf_probe_$v shuf_probe_$v.c shuf_ops.S
          done
          gcc -O1 -o simda_probe simda_probe.c simda_ops.S
          for v in plant badop; do
            sed "s/\"simda_rows.h\"/\"simda_rows_$v.h\"/" simda_probe.c > simda_probe_$v.c
            gcc -O1 -o simda_probe_$v simda_probe_$v.c simda_ops.S
          done
          # D373: set B runs the SAME probe source against its own rows header and its own .S.
          for v in "" _plant _badop; do
            sed "s/\"simda_rows.h\"/\"simdb_rows$v.h\"/" simda_probe.c > simdb_probe$v.c
            gcc -O1 -o simdb_probe$v simdb_probe$v.c simdb_ops.S
          done
          # D384: set C (wave E's legacy forms), the same probe source again.
          for v in "" _plant _badop; do
            sed "s/\"simda_rows.h\"/\"simdc_rows$v.h\"/" simda_probe.c > simdc_probe$v.c
            gcc -O1 -o simdc_probe$v simdc_probe$v.c simdc_ops.S
          done
          gcc -O1 -o sha_probe sha_probe.c sha_ops.S
          for v in plant badop wk; do
            sed "s/\"sha_rows.h\"/\"sha_rows_$v.h\"/" sha_probe.c > sha_probe_$v.c
            gcc -O1 -o sha_probe_$v sha_probe_$v.c sha_ops.S
          done
          gcc -O1 -o aes_probe aes_probe.c aes_ops.S
          for v in plant badop hi; do
            sed "s/\"aes_rows.h\"/\"aes_rows_$v.h\"/" aes_probe.c > aes_probe_$v.c
            gcc -O1 -o aes_probe_$v aes_probe_$v.c aes_ops.S
          done
          gcc -O1 -o vexsil_probe vexsil_probe.c vexsil_ops.S
          for v in plant badop hi; do
            sed "s/\"vexsil_rows.h\"/\"vexsil_rows_$v.h\"/" vexsil_probe.c > vexsil_probe_$v.c
            gcc -O1 -o vexsil_probe_$v vexsil_probe_$v.c vexsil_ops.S
          done
          gcc -O1 -o vexsilb_probe vexsilb_probe.c vexsilb_ops.S
          for v in plant badop hi; do
            sed "s/\"vexsilb_rows.h\"/\"vexsilb_rows_$v.h\"/" vexsilb_probe.c > vexsilb_probe_$v.c
            gcc -O1 -o vexsilb_probe_$v vexsilb_probe_$v.c vexsilb_ops.S
          done
          gcc -O1 -o vexsilc_probe vexsilc_probe.c vexsilc_ops.S
          for v in plant badop hi; do
            sed "s/\"vexsilc_rows.h\"/\"vexsilc_rows_$v.h\"/" vexsilc_probe.c > vexsilc_probe_$v.c
            gcc -O1 -o vexsilc_probe_$v vexsilc_probe_$v.c vexsilc_ops.S
          done
          gcc -O1 -o vexsild_probe vexsild_probe.c vexsild_ops.S
          for v in plant plant-op plant-nf plant-a0 plant-f; do
            sed "s/\"vexsild_rows.h\"/\"vexsild_rows_$v.h\"/" vexsild_probe.c > vexsild_probe_$v.c
            gcc -O1 -o vexsild_probe_$v vexsild_probe_$v.c vexsild_ops.S
          done
          gcc -O1 -o vexsile_probe vexsile_probe.c vexsile_ops.S
          for v in plant badop hi; do
            sed "s/\"vexsile_rows.h\"/\"vexsile_rows_$v.h\"/" vexsile_probe.c > vexsile_probe_$v.c
            gcc -O1 -o vexsile_probe_$v vexsile_probe_$v.c vexsile_ops.S
          done
          # D376: D371's probe source, compiled against the movntdqa / VEX half-move rows.
          for v in "" _plant _badop _hi _mem; do
            sed "s/\"vexsilf_rows.h\"/\"vexsili_rows$v.h\"/" vexsilf_probe.c > vexsili_probe$v.c
            gcc -O1 -o vexsili_probe$v vexsili_probe$v.c vexsili_ops.S
          done
          # D379: D371's probe source, compiled against the pabs / pmulld rows.
          for v in "" _plant _badop _hi _mem; do
            sed "s/\"vexsilf_rows.h\"/\"vexsilj_rows$v.h\"/" vexsilf_probe.c > vexsilj_probe$v.c
            gcc -O1 -o vexsilj_probe$v vexsilj_probe$v.c vexsilj_ops.S
          done
          # D375: D371's probe source (an EXPECTED buffer), compiled against the lane insert/extract rows.
          for v in "" _plant _badop _hi _mem; do
            sed "s/\"vexsilf_rows.h\"/\"vexsilh_rows$v.h\"/" vexsilf_probe.c > vexsilh_probe$v.c
            gcc -O1 -o vexsilh_probe$v vexsilh_probe$v.c vexsilh_ops.S
          done
          # D374: D361's probe source, compiled against the VEX-twin rows and their own .S.
          for v in "" _plant _badop _hi; do
            sed "s/\"vexsile_rows.h\"/\"vexsilg_rows$v.h\"/" vexsile_probe.c > vexsilg_probe$v.c
            gcc -O1 -o vexsilg_probe$v vexsilg_probe$v.c vexsilg_ops.S
          done
          # D384: the same probe source, compiled against wave E's VEX-twin rows and their own .S.
          for v in "" _plant _badop _hi; do
            sed "s/\"vexsile_rows.h\"/\"vexsilk_rows$v.h\"/" vexsile_probe.c > vexsilk_probe$v.c
            gcc -O1 -o vexsilk_probe$v vexsilk_probe$v.c vexsilk_ops.S
          done
          gcc -O1 -o vexsilf_probe vexsilf_probe.c vexsilf_ops.S
          for v in plant badop hi mem; do
            sed "s/\"vexsilf_rows.h\"/\"vexsilf_rows_$v.h\"/" vexsilf_probe.c > vexsilf_probe_$v.c
            gcc -O1 -o vexsilf_probe_$v vexsilf_probe_$v.c vexsilf_ops.S
          done

      # B5: the packed half has its own pair. A plant in a SCALAR row proves nothing about the 128-bit comparison,
      # so --plant-packed flips a bit of a packed row's HIGH quadword, and --plant-pop a packed instruction byte.
      - name: Controls (a wrong expectation reds exactly one row; a wrong instruction refuses the run)
        working-directory: hwprobe
        run: |
          set +e
          ./probe_plant > plant.out; rc_plant=$?
          ./probe_badop > badop.out; rc_badop=$?
          ./probe_pplant > pplant.out; rc_pplant=$?
          ./probe_pbadop > pbadop.out; rc_pbadop=$?
          set -e
          tail -1 plant.out; cat badop.out; grep '^DIFF' pplant.out; cat pbadop.out
          echo "plant rc=$rc_plant (want 1) · badop rc=$rc_badop (want 2) · pplant rc=$rc_pplant (want 1) · pbadop rc=$rc_pbadop (want 2)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' plant.out)" = 1
          test "$rc_badop" = 2
          test "$rc_pplant" = 1
          test "$(grep -c '^DIFF' pplant.out)" = 1
          grep -q '^DIFF [a-z]*p[sd]_' pplant.out
          test "$rc_pbadop" = 2
          grep -q 'at +28' pbadop.out

      - name: Referee
        working-directory: hwprobe
        run: ./probe

      # D330: THE INTEGER PATH (ADCX, ADOX, MULX), with its OWN pair of controls — a plant in an SSE row says nothing
      # about the GPR/RFLAGS comparison. A wrong expectation (CF flipped in one row) must red exactly that row, and a
      # wrong declared instruction byte must refuse the run.
      - name: Integer controls (a wrong expectation reds exactly one row; a wrong instruction refuses the run)
        working-directory: hwprobe
        run: |
          set +e
          ./int_probe_plant > int_plant.out; rc_plant=$?
          ./int_probe_badop > int_badop.out; rc_badop=$?
          set -e
          head -1 int_plant.out; grep '^DIFF' int_plant.out; tail -1 int_plant.out; cat int_badop.out
          echo "int plant rc=$rc_plant (want 1) · int badop rc=$rc_badop (want 2)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' int_plant.out)" = 1
          grep -q '^DIFF adcxq_rr_zero_c0 ' int_plant.out
          test "$rc_badop" = 2
          grep -q '^REFUSED i_adcxq_rr:' int_badop.out

      # D334: THE MASK'S OWN CONTROL. W1c rows compare RFLAGS on a per-row mask (the SDM leaves AF/PF, and for BEXTR SF,
      # undefined). A mask that dropped a DEFINED flag would make rows vacuous on it, so a flipped ZF in a masked row
      # (andnq_rr_zero) must red exactly that row.
      - name: Integer mask control (a defined flag in a masked row is still compared)
        working-directory: hwprobe
        run: |
          set +e
          ./int_probe_plantnew > int_plantnew.out; rc_pn=$?
          set -e
          grep '^DIFF' int_plantnew.out; tail -1 int_plantnew.out
          echo "int plant-new rc=$rc_pn (want 1)"
          test "$rc_pn" = 1
          test "$(grep -c '^DIFF' int_plantnew.out)" = 1
          grep -q '^DIFF andnq_rr_zero ' int_plantnew.out

      - name: Integer referee
        working-directory: hwprobe
        run: ./int_probe

      # D333: THE BIT-STRING PATH (BT/BTS/BTR/BTC, memory base, register offset), with its OWN controls — a CF plant, a
      # MEMORY plant (one BTS row expects the x86isa rule's byte), a STRAY plant (the probe watches the wrong byte, so the
      # real write lands where the whole-buffer comparison expects PATTERN), and a wrong declared instruction byte.
      - name: Bit-string controls (each plant reds exactly its row; a wrong instruction refuses the run)
        working-directory: hwprobe
        run: |
          set +e
          ./bitstr_probe_plant > bs_plant.out; rc_plant=$?
          ./bitstr_probe_pmem > bs_pmem.out; rc_pmem=$?
          ./bitstr_probe_stray > bs_stray.out; rc_stray=$?
          ./bitstr_probe_badop > bs_badop.out; rc_badop=$?
          set -e
          grep '^DIFF' bs_plant.out; grep '^DIFF' bs_pmem.out; grep '^DIFF' bs_stray.out; cat bs_badop.out
          echo "bs plant rc=$rc_plant (want 1) · pmem rc=$rc_pmem (want 1) · stray rc=$rc_stray (want 1) · badop rc=$rc_badop (want 2)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' bs_plant.out)" = 1
          grep -q '^DIFF btw_mr_p0_v00 ' bs_plant.out
          test "$rc_pmem" = 1
          test "$(grep -c '^DIFF' bs_pmem.out)" = 1
          grep -q '^DIFF btsw_mr_m1_v00 ' bs_pmem.out
          test "$rc_stray" = 1
          test "$(grep -c '^DIFF' bs_stray.out)" = 1
          grep -q '^DIFF btcw_mr_p0_v00 .*STRAY WRITE' bs_stray.out
          test "$rc_badop" = 2
          grep -q '^REFUSED b_btw_mr:' bs_badop.out

      - name: Bit-string referee (the verdict is the SDM column; the x86isa column is a reading)
        working-directory: hwprobe
        run: |
          set +e
          ./bitstr_probe > bitstr.out; rc=$?
          set -e
          grep -v '^ok  ' bitstr.out || true
          echo "--- negative offsets where the two rules differ (sample: -1, -3, -4097) ---"
          grep -E '_m(1|3|4097)_' bitstr.out | grep 'rules differ' || true
          echo "bitstr rc=$rc"
          test "$rc" = 0

      # D336: THE SHUFFLE PATH (PSHUFB, PALIGNR, PINSRD/Q, PEXTRD/Q), with its OWN controls — a plant in the HIGH quadword of
      # XMM0's expectation (the 128-bit comparison), a wrong declared instruction byte, and a set bit 32 in one PEXTRD row's
      # expected RAX (the zero-extension is compared, not assumed).
      - name: Shuffle controls (each plant reds exactly its row; a wrong instruction refuses the run)
        working-directory: hwprobe
        run: |
          set +e
          ./shuf_probe_plant > sh_plant.out; rc_plant=$?
          ./shuf_probe_badop > sh_badop.out; rc_badop=$?
          ./shuf_probe_zx > sh_zx.out; rc_zx=$?
          ./shuf_probe_mem > sh_mem.out; rc_mem=$?
          set -e
          head -1 sh_plant.out; grep '^DIFF' sh_plant.out; cat sh_badop.out; grep '^DIFF' sh_zx.out; grep '^DIFF' sh_mem.out
          echo "shuf plant rc=$rc_plant (want 1) · badop rc=$rc_badop (want 2) · zx rc=$rc_zx (want 1) · mem rc=$rc_mem (want 1)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' sh_plant.out)" = 1
          grep -q '^DIFF pshufb_rr_a1_ident ' sh_plant.out
          test "$rc_badop" = 2
          grep -q '^REFUSED s_pshufb_rr:' sh_badop.out
          test "$rc_zx" = 1
          test "$(grep -c '^DIFF' sh_zx.out)" = 1
          grep -q '^DIFF pextrd_rr_i1_p1 ' sh_zx.out
          # D362: one bit of a PEXTRD STORE row's expected memory flipped: the 16 bytes at [RBX] are compared, not assumed.
          test "$rc_mem" = 1
          test "$(grep -c '^DIFF' sh_mem.out)" = 1
          grep -q '^DIFF pextrd_mr_i1_p1 ' sh_mem.out

      - name: Shuffle referee
        working-directory: hwprobe
        run: |
          set +e
          ./shuf_probe > shuf.out; rc=$?
          set -e
          head -1 shuf.out; grep -v '^ok  ' shuf.out || true
          echo "shuf rc=$rc"
          test "$rc" = 0
          grep -q '^rows 276 disagreements 0$' shuf.out

      # D335: THE PACKED-INTEGER ARITHMETIC PATH (PMADDWD … PACKSSDW, xmm and m128), with its OWN pair of controls — a plant
      # in any other path says nothing about this 128-bit comparison. A wrong expectation (bit 64, the HIGH quadword, of row
      # 0) must red exactly that row, and a wrong declared instruction byte must refuse the run.
      - name: Packed-integer controls (a wrong expectation reds exactly one row; a wrong instruction refuses the run)
        working-directory: hwprobe
        run: |
          set +e
          ./simda_probe_plant > simda_plant.out; rc_plant=$?
          ./simda_probe_badop > simda_badop.out; rc_badop=$?
          set -e
          head -1 simda_plant.out; grep '^DIFF' simda_plant.out; tail -1 simda_plant.out; cat simda_badop.out
          echo "simda plant rc=$rc_plant (want 1) · simda badop rc=$rc_badop (want 2)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' simda_plant.out)" = 1
          grep -q '^DIFF pmaddwd_xx_edge0 ' simda_plant.out
          test "$rc_badop" = 2
          grep -q '^REFUSED v_pmaddwd_xx:' simda_badop.out

      - name: Packed-integer referee
        working-directory: hwprobe
        run: |
          set +e
          ./simda_probe > simda.out; rc=$?
          set -e
          head -1 simda.out
          grep -v '^ok  ' simda.out || true
          echo "simda rc=$rc"
          test "$rc" = 0

      # D373: set B (PMINSW PMULHW PMULHUW PAVGB), the same controls and the same referee as set A.
      - name: Packed-integer set B controls and referee (D373)
        working-directory: hwprobe
        run: |
          set +e
          ./simdb_probe_plant > simdb_plant.out; rc_plant=$?
          ./simdb_probe_badop > simdb_badop.out; rc_badop=$?
          ./simdb_probe > simdb.out; rc=$?
          set -e
          head -1 simdb_plant.out; grep '^DIFF' simdb_plant.out; tail -1 simdb_plant.out; cat simdb_badop.out
          echo "simdb plant rc=$rc_plant (want 1) · simdb badop rc=$rc_badop (want 2)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' simdb_plant.out)" = 1
          grep -q '^DIFF pminsw_xx_edge0 ' simdb_plant.out
          test "$rc_badop" = 2
          grep -q '^REFUSED v_pminsw_xx:' simdb_badop.out
          head -1 simdb.out
          grep -v '^ok  ' simdb.out || true
          echo "simdb rc=$rc"
          test "$rc" = 0

      # D384: set C (PSUBSW PAVGW PMULDQ), the same controls and the same referee as sets A and B.
      - name: Packed-integer set C controls and referee (D384)
        working-directory: hwprobe
        run: |
          set +e
          ./simdc_probe_plant > simdc_plant.out; rc_plant=$?
          ./simdc_probe_badop > simdc_badop.out; rc_badop=$?
          ./simdc_probe > simdc.out; rc=$?
          set -e
          head -1 simdc_plant.out; grep '^DIFF' simdc_plant.out; tail -1 simdc_plant.out; cat simdc_badop.out
          echo "simdc plant rc=$rc_plant (want 1) · simdc badop rc=$rc_badop (want 2)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' simdc_plant.out)" = 1
          grep -q '^DIFF psubsw_xx_edge0 ' simdc_plant.out
          test "$rc_badop" = 2
          grep -q '^REFUSED v_psubsw_xx:' simdc_badop.out
          head -1 simdc.out
          grep -v '^ok  ' simdc.out || true
          echo "simdc rc=$rc"
          test "$rc" = 0

      # D338: THE SHA-NI PATH (SHA256MSG1, SHA256MSG2, SHA256RNDS2, xmm and m128). ⚠️ NOT EVERY LEG HAS THE EXTENSION:
      # `macos-15-intel` is an i7-8700B (Coffee Lake), which has no SHA-NI, and sha_probe REFUSES there by CPUID with its
      # OWN exit code, 3. That refusal is PRINTED and ACCEPTED on that one label, and only there: every ubuntu-latest draw
      # so far (AMD EPYC, Intel Xeon 8573C) carries SHA-NI, so a 3 on any other leg FAILS the job — a refusal must never
      # read as a pass where a reading was expected. The controls and the referee run only where the CPUID check passed,
      # and a leg that skips them says so in this step's output.
      - name: SHA-NI guard (CPUID; a refusal is accepted on macos-15-intel only, and printed)
        working-directory: hwprobe
        run: |
          set +e
          ./sha_probe --cpuid > sha_cpuid.out; rc=$?
          set -e
          cat sha_cpuid.out
          echo "sha cpuid rc=$rc (0 = SHA-NI present, 3 = absent)"
          if [ "$rc" = 0 ]; then
            echo "SHA_NI=present" >> "$GITHUB_ENV"
          elif [ "$rc" = 3 ] && [ "${{ matrix.os }}" = macos-15-intel ]; then
            echo "::notice title=SHA-NI absent::${{ matrix.os }} refused the SHA-NI path by CPUID (rc 3): its SHA rows were NOT read on this leg"
            echo "SHA_NI=absent" >> "$GITHUB_ENV"
          else
            echo "⛔ sha_probe --cpuid rc=$rc on ${{ matrix.os }}: not an accepted refusal on this leg"
            exit 1
          fi

      # The SHA controls — a plant in the HIGH quadword of one row's expectation (the 128-bit comparison), a wrong declared
      # instruction byte, and one SHA256RNDS2 row's expectation computed with WK from XMM0's HIGH quadword (the implicit
      # operand's half is compared, not assumed).
      - name: SHA controls (each plant reds exactly its row; a wrong instruction refuses the run)
        if: env.SHA_NI == 'present'
        working-directory: hwprobe
        run: |
          set +e
          ./sha_probe_plant > sha_plant.out; rc_plant=$?
          ./sha_probe_badop > sha_badop.out; rc_badop=$?
          ./sha_probe_wk > sha_wk.out; rc_wk=$?
          set -e
          head -1 sha_plant.out; grep '^DIFF' sha_plant.out; cat sha_badop.out; grep '^DIFF' sha_wk.out
          echo "sha plant rc=$rc_plant (want 1) · badop rc=$rc_badop (want 2) · wk rc=$rc_wk (want 1)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' sha_plant.out)" = 1
          grep -q '^DIFF sha256msg1_xx_edge0 ' sha_plant.out
          test "$rc_badop" = 2
          grep -q '^REFUSED h_sha256msg1_xx:' sha_badop.out
          test "$rc_wk" = 1
          test "$(grep -c '^DIFF' sha_wk.out)" = 1
          grep -q '^DIFF sha256rnds2_xx_kat_abc_r01 ' sha_wk.out

      - name: SHA referee
        if: env.SHA_NI == 'present'
        working-directory: hwprobe
        run: |
          set +e
          ./sha_probe > sha.out; rc=$?
          set -e
          head -1 sha.out
          grep -v '^ok  ' sha.out || true
          echo "sha rc=$rc"
          test "$rc" = 0

      - name: SHA-NI not read on this leg (printed, never silent)
        if: env.SHA_NI == 'absent'
        run: |
          echo "⚠️ ${{ matrix.os }}: SHA-NI absent by CPUID — the SHA controls and the SHA referee did NOT run on this leg."
          echo "   This leg contributes NO SHA reading; D338's vendor coverage must come from a SHA-capable leg."

      # D342: THE AES-NI / PCLMULQDQ / VEX PATH (AESENC, AESENCLAST legacy; VAESENC, VAESENCLAST, VPCLMULQDQ, VPSHUFB,
      # VPALIGNR, VPSLLDQ, VPSRLDQ VEX.128). D342 predicts EVERY leg has AES-NI, PCLMULQDQ and AVX — including
      # `macos-15-intel`'s i7-8700B, unlike SHA-NI — so a CPUID refusal (exit 3) is accepted on NO leg: it fails the job.
      # Each row compares all 256 bits of the destination's YMM register and of the other two.
      - name: AES controls (each plant reds exactly its row; a wrong instruction refuses the run)
        working-directory: hwprobe
        run: |
          ./aes_probe --cpuid
          set +e
          ./aes_probe_plant > aes_plant.out; rc_plant=$?
          ./aes_probe_badop > aes_badop.out; rc_badop=$?
          ./aes_probe_hi > aes_hi.out; rc_hi=$?
          set -e
          head -1 aes_plant.out; grep '^DIFF' aes_plant.out; cat aes_badop.out; grep '^DIFF' aes_hi.out
          echo "aes plant rc=$rc_plant (want 1) · badop rc=$rc_badop (want 2) · hi rc=$rc_hi (want 1)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' aes_plant.out)" = 1
          grep -q '^DIFF aesenc_edge0 ' aes_plant.out
          test "$rc_badop" = 2
          grep -q '^REFUSED e_aesenc:' aes_badop.out
          test "$rc_hi" = 1
          test "$(grep -c '^DIFF' aes_hi.out)" = 1
          grep -q '^DIFF vaesenc_edge0 ' aes_hi.out

      - name: AES referee
        working-directory: hwprobe
        run: |
          set +e
          ./aes_probe > aes.out; rc=$?
          set -e
          head -1 aes.out
          grep -v '^ok  ' aes.out || true
          echo "aes rc=$rc"
          test "$rc" = 0

      # D345 (V7): THE VEX TWINS OF ELEVEN MAIN-TABLE FORMS (vshufps vpsrad vpsraw vaddps vsubps vmulps vpunpcklwd
      # vpunpckhwd vpunpcklbw vpackuswb vpmovmskb, VEX.128 and VEX.256), which x86isa refuses (D345 P1). D345 predicts
      # EVERY leg has AVX and AVX2 (the i7-8700B included), so a CPUID refusal (exit 3) is accepted on NO leg. Each row
      # compares all 256 bits of YMM1-3, RAX, MXCSR and the six arithmetic flags.
      - name: VEX-silicon controls (each plant reds exactly its row; a wrong instruction refuses the run)
        working-directory: hwprobe
        run: |
          ./vexsil_probe --cpuid
          set +e
          ./vexsil_probe_plant > vexsil_plant.out; rc_plant=$?
          ./vexsil_probe_badop > vexsil_badop.out; rc_badop=$?
          ./vexsil_probe_hi > vexsil_hi.out; rc_hi=$?
          set -e
          head -1 vexsil_plant.out; grep '^DIFF' vexsil_plant.out; cat vexsil_badop.out; grep '^DIFF' vexsil_hi.out
          echo "vexsil plant rc=$rc_plant (want 1) · badop rc=$rc_badop (want 2) · hi rc=$rc_hi (want 1)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' vexsil_plant.out)" = 1
          grep -q '^DIFF vshufps256_1b_p0 ' vexsil_plant.out
          test "$rc_badop" = 2
          grep -q '^REFUSED x_vshufps128_00:' vexsil_badop.out
          test "$rc_hi" = 1
          test "$(grep -c '^DIFF' vexsil_hi.out)" = 1
          grep -q '^DIFF vpackuswb128_edge0 ' vexsil_hi.out

      - name: VEX-silicon referee
        working-directory: hwprobe
        run: |
          set +e
          ./vexsil_probe > vexsil.out; rc=$?
          set -e
          head -1 vexsil.out
          grep -v '^ok  ' vexsil.out || true
          echo "vexsil rc=$rc"
          test "$rc" = 0

      # D348 (V8b): THE VEX TWINS OF FOUR D335 KINDS (vpmaddwd vpmulhrsw vpmaddubsw vpackssdw, VEX.128 and VEX.256,
      # register forms), which x86isa refuses (D348 P1). As V7, a CPUID refusal (exit 3) is accepted on NO leg. Each row
      # compares all 256 bits of YMM1-3, RAX, MXCSR and the six arithmetic flags.
      - name: VEX-silicon B controls (each plant reds exactly its row; a wrong instruction refuses the run)
        working-directory: hwprobe
        run: |
          ./vexsilb_probe --cpuid
          set +e
          ./vexsilb_probe_plant > vexsilb_plant.out; rc_plant=$?
          ./vexsilb_probe_badop > vexsilb_badop.out; rc_badop=$?
          ./vexsilb_probe_hi > vexsilb_hi.out; rc_hi=$?
          set -e
          head -1 vexsilb_plant.out; grep '^DIFF' vexsilb_plant.out; cat vexsilb_badop.out; grep '^DIFF' vexsilb_hi.out
          echo "vexsilb plant rc=$rc_plant (want 1) · badop rc=$rc_badop (want 2) · hi rc=$rc_hi (want 1)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' vexsilb_plant.out)" = 1
          grep -q '^DIFF vpackssdw256_lane ' vexsilb_plant.out
          test "$rc_badop" = 2
          grep -q '^REFUSED x_vpmaddwd128:' vexsilb_badop.out
          test "$rc_hi" = 1
          test "$(grep -c '^DIFF' vexsilb_hi.out)" = 1
          grep -q '^DIFF vpmaddwd128_edge0 ' vexsilb_hi.out

      - name: VEX-silicon B referee
        working-directory: hwprobe
        run: |
          set +e
          ./vexsilb_probe > vexsilb.out; rc=$?
          set -e
          head -1 vexsilb.out
          grep -v '^ok  ' vexsilb.out || true
          echo "vexsilb rc=$rc"
          test "$rc" = 0

      # D350 (V8c): VPBROADCASTD (xmm, m32) and the four V8b twins' VEX MEMORY forms, each memory case at offset 0 AND at an
      # odd offset; x86isa refuses all 12 encodings (D350 P1). A CPUID refusal (exit 3) is accepted on NO leg.
      - name: VEX-memory controls (each plant reds exactly its row; a wrong instruction refuses the run)
        working-directory: hwprobe
        run: |
          ./vexsilc_probe --cpuid
          set +e
          ./vexsilc_probe_plant > vexsilc_plant.out; rc_plant=$?
          ./vexsilc_probe_badop > vexsilc_badop.out; rc_badop=$?
          ./vexsilc_probe_hi > vexsilc_hi.out; rc_hi=$?
          set -e
          head -1 vexsilc_plant.out; grep '^DIFF' vexsilc_plant.out; cat vexsilc_badop.out; grep '^DIFF' vexsilc_hi.out
          echo "vexsilc plant rc=$rc_plant (want 1) · badop rc=$rc_badop (want 2) · hi rc=$rc_hi (want 1)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' vexsilc_plant.out)" = 1
          grep -q '^DIFF vpmaddwd256_m_lane_u ' vexsilc_plant.out
          test "$rc_badop" = 2
          grep -q '^REFUSED x_vpbroadcastd128_r:' vexsilc_badop.out
          test "$rc_hi" = 1
          test "$(grep -c '^DIFF' vexsilc_hi.out)" = 1
          grep -q '^DIFF vpbroadcastd128_m_k1_a ' vexsilc_hi.out

      - name: VEX-memory referee
        working-directory: hwprobe
        run: |
          set +e
          ./vexsilc_probe > vexsilc.out; rc=$?
          set -e
          head -1 vexsilc.out
          grep -v '^ok  ' vexsilc.out || true
          echo "vexsilc rc=$rc"
          test "$rc" = 0

      # D354 (V9b): the six packed moves' VEX memory forms, loads and stores, and the FIRST FAULT ROWS: an aligned kind
      # (vmovdqa/vmovaps/vmovapd) off its width's alignment (16 at VEX.128, 32 at VEX.256) must raise #GP, caught as a
      # signal. x86isa and Rosetta 2 both EXECUTE those encodings, so this job is the rule's only second source.
      # Each plant must red exactly its own row: a value bit, a declared byte (refuse, exit 2), an unaligned kind
      # expected to fault, an aligned kind at offset 0 expected to fault, and a fault row expected to run.
      - name: VEX-move controls (each plant reds exactly its row; a wrong instruction refuses the run)
        working-directory: hwprobe
        run: |
          ./vexsild_probe --cpuid
          set +e
          for v in plant plant-op plant-nf plant-a0 plant-f; do
            ./vexsild_probe_$v > vexsild_$v.out; echo "$?" > vexsild_$v.rc
          done
          set -e
          for v in plant plant-nf plant-a0 plant-f; do
            echo "vexsild $v rc=$(cat vexsild_$v.rc) (want 1)"; grep '^DIFF' vexsild_$v.out || true
            test "$(cat vexsild_$v.rc)" = 1
            test "$(grep -c '^DIFF' vexsild_$v.out)" = 1
          done
          grep -q '^DIFF vmovdqu256_ld_a0_r0 ' vexsild_plant.out
          grep -q '^DIFF vmovups128_ld_u1_r0 .*RAN' vexsild_plant-nf.out
          grep -q '^DIFF vmovaps256_st_a0_r0 .*RAN' vexsild_plant-a0.out
          grep -q '^DIFF vmovapd256_ld_f16 .*FAULTED' vexsild_plant-f.out
          cat vexsild_plant-op.out
          echo "vexsild plant-op rc=$(cat vexsild_plant-op.rc) (want 2)"
          test "$(cat vexsild_plant-op.rc)" = 2
          grep -q '^REFUSED x_vmovdqa128_ld:' vexsild_plant-op.out

      - name: VEX-move referee
        working-directory: hwprobe
        run: |
          set +e
          ./vexsild_probe > vexsild.out; rc=$?
          set -e
          head -1 vexsild.out
          grep -v '^ok  ' vexsild.out || true
          grep -c '^ok .*faulted' vexsild.out || true
          echo "vexsild rc=$rc"

      - name: V10 VEX-memory controls (D361) (each plant reds exactly its row; a wrong instruction refuses the run)
        working-directory: hwprobe
        run: |
          ./vexsile_probe --cpuid
          set +e
          ./vexsile_probe_plant > vexsile_plant.out; rc_plant=$?
          ./vexsile_probe_badop > vexsile_badop.out; rc_badop=$?
          ./vexsile_probe_hi > vexsile_hi.out; rc_hi=$?
          set -e
          head -1 vexsile_plant.out; grep '^DIFF' vexsile_plant.out; cat vexsile_badop.out; grep '^DIFF' vexsile_hi.out
          echo "vexsile plant rc=$rc_plant (want 1) · badop rc=$rc_badop (want 2) · hi rc=$rc_hi (want 1)"
          test "$rc_plant" = 1
          test "$(grep -c '^DIFF' vexsile_plant.out)" = 1
          grep -q '^DIFF vmulps256_m_hionly_IE_a ' vexsile_plant.out
          test "$rc_badop" = 2
          grep -q '^REFUSED x_vpshufb128_m:' vexsile_badop.out
          test "$rc_hi" = 1
          test "$(grep -c '^DIFF' vexsile_hi.out)" = 1
          grep -q '^DIFF vpshufb128_m_ident_a ' vexsile_hi.out

      - name: V10 VEX-memory referee (D361)
        working-directory: hwprobe
        run: |
          set +e
          ./vexsile_probe > vexsile.out; rc=$?
          set -e
          head -1 vexsile.out
          grep -v '^ok  ' vexsile.out || true
          echo "vexsile rc=$rc"
          test "$rc" = 0

      # D376: movntdqa and the VEX half-moves, D371's probe and controls.
      - name: D376 movntdqa and VEX half-move controls and referee (each plant reds exactly its row; a wrong instruction refuses the run)
        working-directory: hwprobe
        run: |
          ./vexsili_probe --cpuid
          set +e
          ./vexsili_probe_plant > vexsili_plant.out; rc_plant=$?
          ./vexsili_probe_badop > vexsili_badop.out; rc_badop=$?
          ./vexsili_probe_hi > vexsili_hi.out; rc_hi=$?
          ./vexsili_probe_mem > vexsili_mem.out; rc_mem=$?
          ./vexsili_probe > vexsili.out; rc=$?
          set -e
          grep '^DIFF' vexsili_plant.out vexsili_hi.out vexsili_mem.out; cat vexsili_badop.out
          echo "vexsili plant rc=$rc_plant · badop rc=$rc_badop · hi rc=$rc_hi · mem rc=$rc_mem (want 1 2 1 1)"
