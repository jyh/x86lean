name: CI

# Every check this repository can make without the ACL2 oracle.
#
# ⚠️ WHAT IS NOT HERE, SAID PLAINLY: the differential run against ACL2 x86isa.
# Certifying `projects/x86isa/top.cert` pulls in the `std`, `bitops` and `rtl`
# books and is far too long for a per-push job. It runs locally (see
# docs/ORACLE-SETUP.md) and its RESULT is recorded in the repository. A CI that
# pretended to run it would be a green tick for work it did not do.
#
# ⚠️ AND SO ARE THE ORACLE-DEPENDENT GATES, for the same reason and stated here
# rather than left to be noticed: they EXECUTE forms on the oracle, so they
# cannot run on a runner that has no oracle. They run beside the differential —
# `scripts/run_differential.sh` invokes each of them BEFORE the expensive run and
# stops on it — and each is seconds, which is what makes running them every batch
# realistic. Naming them here is the point: an oracle-dependent gate that is not
# in this file is a gate somebody has to remember.
#
#   * `scripts/oracle_availability.py`  (P1 batch 21, D65)   ~6 s
#   * `scripts/check_driver_cr4.py`     (P2 vector 1, D86)   ~19 s
#
# ⛔⛔ AND A THIRD, FOR A DIFFERENT REASON: `scripts/kernel_cost.py`.  It is not
# oracle-dependent — it is MACHINE-CALIBRATED, and that is a stronger reason to
# keep it off a runner.  `scripts/kernel_ceilings.txt` registers ABSOLUTE
# MILLISECONDS at `measured x 1.6`, taken on a QUIET DEVELOPMENT MACHINE with the
# load conditions written beside each line.  A GitHub runner is a different
# machine, and MEASURED it is about twice as slow — two readings, against six
# local ones on the same tree:
#
#     module            CI-1     CI-2     local      CI/local
#     X86.Syntax         418      436      ~145        3.0x
#     X86.Theorems      1530     1640      ~721        2.3x
#     Tests.Anchors      928     1030      ~474        2.2x
#     memDestSweep     27 400   29 800   ~17 800       1.7x
#     vectorCoverage    5 590    5 860    ~1 900       3.1x
#     TOTAL            61 400   66 100   ~31 700       2.1x
#
# ⇒ The step failed here on EVERY module, which is a fact about the hardware and
# not about the tree: the same tree passes locally with ~1% run-to-run spread.
#
# ⚠️ AND RAISING THE CEILINGS TO FIT WAS CONSIDERED AND REFUSED.  The per-module
# factor VARIES from 1.7x to 3.1x, so no single calibration constant exists; and
# ceilings loosened to a runner's scale would be ~2x slack on the machine where
# batches are actually developed — this file's own history is a record of
# fighting exactly that slack (see the `2.4x headroom will not notice a
# doubling` note beside Tests.Coverage).  The gate earns its keep by being TIGHT
# against a known machine; a portable version of it would have to divide by
# something that varies the same way as its subject, and the measurement above
# says nothing here does.
#
# ⇒ So it runs where it is calibrated: `scripts/run_differential.sh` invokes it
# on every batch, which is also the repair for the real gap — a discipline that
# depends on a head REMEMBERING is one this session demonstrably failed to keep.
# See D97.
#
# ⛔ THIS COMMENT USED TO END "the list of those has exactly two entries", and
# D86's batch made it three. A COUNT IN A COMMENT BESIDE A LIST is the thing that
# goes stale while the list stays right — D41's rule, D74's repair, and the CI
# file was carrying the same shape one more time. The list is now written out and
# carries no total.
#
# The runner is x86-64 on purpose: it is the same lane plan v1 §4.4's hardware
# co-simulation will need, and the developer machine is arm64.
on:
  push:
  pull_request:
  workflow_dispatch:

# THROTTLE (the Captain, 2026-09-07 17:4x: "let's throttle the CIs"). Measured before this edit: the
# selftest matrix is three jobs of 68-88 min EACH, fired on EVERY push to EVERY branch (18 CI runs in
# the 48 h before the Actions budget ran out at 19:05Z 09-06). The 6-min build and the 5-s scrub are
# not the bill. RULE: a branch push runs the BUILD ONLY; the matrix and kernel-delta run on a PULL
# REQUEST (the merge gate under the fleet's branch -> CI green -> merge law) and on manual dispatch.
# A newer push to the same ref cancels the older run, so a PR with ten pushes buys one matrix, not ten.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ⛔⛔ `fetch-depth: 0` IS LOAD-BEARING HERE TOO, AND ITS ABSENCE COST FIVE
      # DAYS OF RED. `actions/checkout@v4` defaults to depth 1. The User-CPU budget
      # step builds its fixture from six REAL commits via `git rev-parse`; on a
      # depth-1 clone those resolve to EMPTY STRINGS, six commits collapse into
      # one, and 7 of 16 arms lose their transfer ratio while the child still
      # exits 0. Two other jobs in this file already carry this line with a comment
      # saying it is load-bearing — the sibling was never swept for.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false

      - name: Build everything (model, native tier, tests, executables)
        run: lake build X86 X86Native Tests x86lean-diff x86lean-axioms

      # ── the trust gates ──────────────────────────────────────────────────
      - name: Axiom allowlist over the model library
        run: ./scripts/axiom_gate.sh

      - name: Axiom gate RED-FIRST drive (the gate must be seen to fail)
        run: ./scripts/axiom_gate_selftest.sh

      - name: Native tier isolation
        run: ./scripts/check_tier_isolation.sh

      # ── the model gates ──────────────────────────────────────────────────
      - name: Encoding cross-check (every `Instr.len` against a real assembler)
        run: python3 scripts/check_encodings.py

      # ⭐⭐ D128. The availability table keys itself by the `asm` column and
      # MEASURES through the `hx` column, and until this step nothing said they
      # were the same instruction. Needs no ACL2 — clang and objdump only — so it
      # runs here rather than behind the oracle. Red-first, and on BOTH
      # disassemblers where the runner has them (GNU wraps its byte column at
      # seven bytes where LLVM does not; D89).
      - name: Oracle probe encodings — the `hx` that RUNS is the `asm` that NAMES it
        run: python3 scripts/oracle_availability.py --check-encodings

      # ⛔ THIS STEP WAS NAMED "seven planted bugs" UNTIL P1 BATCH 14, when there
      # were thirty-eight. The banner the command PRINTS has been derived from
      # `selftestArms.length` since D29 caught exactly this drift one layer down;
      # the step NAME beside it was still a literal, and had been wrong for seven
      # batches. A number in a label nothing reads is D41's rule in the CI file.
      # ⭐⭐⭐ STEP 9 MOVED TO ITS OWN SHARDED JOB (see `selftest` below).  What
      # stays here is the PARTITION GATE, which runs no arm at all — it is a
      # property of the shard arithmetic — so it costs milliseconds and it is the
      # thing that makes sharding safe: it fails if shards 1..N do not name every
      # arm exactly once.  Sharding a coverage gate is how a coverage gate
      # silently stops covering, and this is what stands in the way of that.
      - name: Shard partition gate (shards 1..6 name every selftest arm exactly once)
        run: lake env .lake/build/bin/x86lean-diff selftest-shards 6

      # ⛔ THE LOCAL RUNNER'S ARGUMENT READER, DRIVEN RED (D173). `ci_local.py` is
      # how every gate in this workflow is exercised on a developer box, and an
      # unrecognised flag used to make it RUN `--job build` instead of answering.
      # The guard is armed here because the runner itself is never run by CI, so
      # nothing else would ever drive it.
      - name: The local CI runner refuses an unknown flag instead of running a job
        run: python3 scripts/ci_local.py --selftest

      - name: The CI matrix agrees with the shard count it passes
        run: python3 scripts/check_ci_shards.py

      # ⭐ P1 SEAL (D68). Tests.Coverage is gated PER DECLARATION now, in absolute
      # milliseconds, because D62 proved the ROW is not its unit and every
      # refinement since batch 14 went into the margin instead of the
      # denominator. `--selftest` drives the four ways this gate could stop
      # looking — a declaration over, the tail over, a gated declaration that is
      # no longer in the profile, and declarations gated with no tail ceiling —
      # plus the control, and it runs FIRST so a stuck gate cannot report a pass.
      - name: Shared-reduction red probe (7 conjuncts + control)
        run: ./scripts/sharing_redprobe.sh

      # ⭐⭐⭐ P2 BATCH 13. `vshiftLane`'s `cnt ≥ w` guard has TWO reasons and only
      # one of them is a theorem: the SDM's saturation rule, which
      # Tests/Coverage.lean asserts, and the fact that the unguarded LEFT shift
      # takes the toolchain down at a count a register operand can hold
      # (`INTERNAL PANIC: Nat.shiftl exponent is too big`, in the interpreter AND
      # in the kernel). A declaration that panics cannot be a red arm inside Lean
      # -- it kills the process rather than failing to elaborate -- so it is a
      # probe, and the probe PLANTS the unguarded spelling instead of describing
      # it. The held-out arm is the one that matters: the two RIGHT shifts
      # saturate quietly at any count, so removing the guard is invisible to
      # every psrl/psra vector and a partial removal would look like a pass.
      - name: Packed-shift count guard, driven red (2 red arms + control + held out)
        run: ./scripts/shift_guard_redprobe.sh

      # ⭐⭐ P2 ITEM 1 (D70, D71, D72). Four theorems landed with the segment
      # base, and each of them is the kind that can be green because it is EMPTY
      # rather than because it is true: an AST walk with a `_ => []` default, a
      # canonicity sweep that bounds a NAMED departure from x86isa, and the
      # window claim the whole OBSERVABILITY of the batch rests on -- an address
      # outside the watched windows reads as zeros in both models and reports
      # agreement about nothing. Each is planted alone and required to report
      # `false`, with an unplanted positive control in the same run. 17 seconds.
      - name: Segment-base red probe (4 arms + control)
        run: ./scripts/segment_redprobe.sh

      # ⭐ P1 SEAL (D66). The demand-side census maps objdump mnemonics onto the
      # roster, and that mapping is where a coverage number inflates itself --
      # strip a suffix too eagerly and `movsbl` becomes the string move `movs`,
      # which the model HAS. The mapping and every line-level rule are driven
      # here; the census itself needs a corpus of downloaded binaries and runs
      # locally, so what CI gates is the instrument, not the reading.
      # ⭐ P1 SEAL (D66, D69). The census needs a corpus of downloaded binaries,
      # so CI gates the INSTRUMENT (the mapping arms) and the STALENESS of the
      # published reading — not the reading itself, which cannot be re-derived
      # here. The staleness check needs no corpus: it recomputes the model's
      # mnemonic identity and refuses if the document was generated against a
      # different one.
      # ⭐⭐ THE ASSEMBLY COLUMN CLASS (the Captain, 09/03 16:5x) added the
      # per-function hand-written/compiler split, its two routes, and the
      # ISA-extension buckets -- and the RED PROBE is what says the new arms can
      # fail: it breaks each rule in memory, one at a time, and requires the
      # selftest to go red. It writes nothing into the tree.
      - name: Demand-census mapping + scope partition + staleness (both halves) + red probe
        run: |
          python3 scripts/demand_census.py --selftest
          python3 scripts/demand_census.py --check
          python3 scripts/census_redprobe.py

      # ⭐ P1 SEAL (D67). The README's Lean example is an INVITATION -- a reader
      # copies it to find out whether this model is usable -- and the one that
      # shipped at the seal did not compile: `open X86` with no `import X86`.
      # The head that wrote it had just corrected three errors of exactly this
      # kind in the draft it replaced.
      - name: README lean blocks compile (+selftest)
        run: |
          python3 scripts/check_readme_lean.py --selftest
          python3 scripts/check_readme_lean.py

      # P1 BATCH 14 (D41): the per-batch narrative in the generated coverage
      # document, gated against the differential records — two artifacts that
      # are not maintained by the same edit.
      - name: Coverage prose names every batch that has a differential record
        run: python3 scripts/check_coverage_prose.py

      # P1 BATCH 16 (D48): every comment that cites a declaration by name and
      # file must be telling the truth. Three phantom citations were standing
      # when this was written, the oldest from batch 11 — each naming a gate
      # that would have been load-bearing if it existed. `--selftest` checks
      # BOTH directions: a phantom is caught, a real citation is not flagged.
      - name: Named cross-references in comments point at something real
        run: |
          python3 scripts/check_citations.py --selftest
          python3 scripts/check_citations.py

      # 2026-09-09: the sibling of the step above, one level out. `check_citations`
      # gates a comment that names a DECLARATION; this gates prose that names a
      # DATA CORPUS. It exists because `b5d1522` measured `unfolding_calibration`'s
      # `--counters` input and reported the answer as if it were the `--walk` one,
      # landed, and pushed to both tiers: the arithmetic was right and the FILE was
      # wrong, and no gate here joined a prose claim to the tool that consumes it.
      # ⛔ The half with teeth is not the prose scan — it is the ROLE REFUSAL the
      # gate exports into `load_walk`/`load_counters`, which before this ACCEPTED
      # each other's corpora (one silently returning a well-formed 12-commit walk,
      # the other an empty dict). `--selftest` drives 9 distinct red arms and the
      # controls that prove they are distinct.
      - name: Prose that names a data corpus agrees with the tool that consumes it
        run: |
          python3 scripts/check_corpus_claims.py --selftest
          python3 scripts/check_corpus_claims.py

      # D146: `scripts/deterministic_cost.py` measures the two candidate
      # DETERMINISTIC proxies for the kernel-delta gate (elaborator heartbeats,
      # which D146 refuted with a plant, and the kernel's own `[kernel] unfolded
      # declarations` counters, which are the live candidate). The measurement
      # itself needs a worktree walk and does not belong in CI; its REWRITER
      # does, because that is the part that can silently drop work.
      # ⛔ It wrapped two PROSE lines that begin with the word `theorem` at
      # column 0 inside doc comments — the wrapper landed inside the comment
      # where it is inert, the module still compiled, and two declarations would
      # have gone unmeasured in a table that looked complete. The arms include
      # the two real shapes out of `Tests/Coverage.lean`, a positive control
      # (the same names OUTSIDE a comment must still be wrapped), and the two
      # refusals that caught it (a wrapped name that never reports; any
      # elaboration error).
      # ⛔ THE STEP NAME CARRIES NO ARM COUNT. It said "(17 arms)" for one
      # sitting and the selftest grew to 23 in the next, so the name became a
      # false claim about its own step — the shape of
      # [[feedback-a-citation-is-an-ungated-claim]]. The tool prints `N/N arms
      # pass` and that number is derived; a number typed here is not.
      - name: Deterministic-cost rewriter, diagnostics parser and sign statistic
        run: python3 scripts/deterministic_cost.py --selftest

      # QUEUE item 4b (D155): the same counter, calibrated over WINDOWS instead of
      # adjacent pairs. Its load-bearing rule is that a ratio computed only over
      # the windows that RESOLVED is computed over the windows with the biggest
      # deltas — so the tool reports the resolved FRACTION beside every ratio and
      # marks the rows where it is 1.0. The arms plant that selection and require
      # the k=1 ratio to sit above the unselected one.
      # ⛔ One arm exists so the scoring can lose: on a corpus where cost really is
      # per-batch, the NULL must beat the counter. Without it, "ku beats the null"
      # would be a fact about the comparison rather than about the counter.
      - name: Unfolding calibration — the selection rule and the null, driven red
        run: python3 scripts/unfolding_calibration.py --selftest

      # QUEUE item 4c (D148): `scripts/threads_ab.py` measures whether the gated
      # number's variance is an artefact of Lean's own within-module parallelism.
      # The MEASUREMENT needs a quiet box and does not belong in CI; its parse
      # and its positive-control logic do, because a control that silently stops
      # scoring turns the whole A/B into a table of tidy numbers about nothing.
      - name: Threads A/B parse and positive-control logic
        run: python3 scripts/threads_ab.py --selftest

      # QUEUE item 4d (D151): `scripts/user_cost_budget.py` scores the child's
      # `user` CPU — recorded per module by `kernel_cost.py` at zero extra cost —
      # against the profiler's `type checking` ms that the merge gate reads, over
      # a re-run of the SAME twelve-commit walk the shipped budgets came from.
      # The WALK needs a worktree and ~70 minutes and does not belong in CI. The
      # REPORT does, and specifically its two arithmetic traps:
      # ⛔ `user` charges elaboration AND kernel, so on `Tests.Coverage` it is a
      # ~57,000 ms number where the gated one is ~25,000 ms. A report in
      # PERCENTAGES ALONE would announce a 2.3x tightening for a candidate
      # carrying exactly the same milliseconds of noise — an improvement
      # manufactured by a larger denominator. The arms plant precisely that case
      # and require it to read `abs 1.00x`, with a held-out arm (a genuinely
      # steadier candidate) that must read tighter on BOTH columns.
      # ⛔ And `getrusage` accounts per PROCESS while the gate has per-DECLARATION
      # budgets, so four of the twenty-three gated units are not expressible by
      # the candidate at all; an arm requires them NAMED rather than omitted,
      # because a table that drops them reports agreement about units nobody
      # measured.
      - name: User-CPU budget report (denominator artifact, coverage, shared rule)
        run: python3 scripts/user_cost_budget.py --selftest

      # D151: `scripts/kernel_delta_budget.txt` opens with "DO NOT EDIT BY HAND:
      # every number below is derived" — and until now NOTHING CHECKED THAT. The
      # committed corpus is right there beside it, so the claim costs a second to
      # make true: re-register from `docs/kernel-delta-history-2026-09-04.jsonl`
      # and require the bytes to match.
      # ⛔ WHAT THIS PROVES, EXACTLY, because the distinction has bitten this
      # repository before: it proves the FILE IS THE SCRIPT'S OUTPUT on the
      # committed readings — i.e. nobody hand-edited a budget and the rule has not
      # drifted from the numbers it produced. It proves NOTHING about whether the
      # rule is the right rule, and a byte-for-byte re-derivation gate that is read
      # as saying more than that is how a generated file's hand-written paragraph
      # comes to read as generated. [[feedback-a-derivation-gate-wraps-a-false-sentence]]
      # ⚠️ It also pins the `budget_info` refactor (D151), which made ONE rule serve
      # the shipped quantity and item 4d's candidate: if that extraction had moved
      # the rule by a rounding step, this step is what would have said so.
      - name: Delta budgets are DERIVED from the committed corpus, not hand-written
        run: |
          python3 scripts/kernel_delta_history.py --register-budget /tmp/kdb-check.txt \
            --readings docs/kernel-delta-history-2026-09-04.jsonl
          diff scripts/kernel_delta_budget.txt /tmp/kdb-check.txt

      # P1 BATCH 16 (D47): the README's headline numbers, gated against the
      # GENERATED coverage table and the per-batch differential records. They
      # had been stale for four batches — and the sentence beneath them said
      # they were "a snapshot", which is what made the staleness read as
      # design. `--selftest` mutates every claim AND one source, because a gate
      # that compared the README to itself would pass every README mutation.
      - name: README headline numbers agree with the generated coverage table
        run: |
          python3 scripts/check_readme_snapshot.py --selftest
          python3 scripts/check_readme_snapshot.py

      # ⭐⭐⭐ P2 VECTOR WAVE, BATCH 0. The record's sixteen `xmmN=` fields are
      # produced TWICE — by `Cpu.renderXmms` and by `x86l-xmms` — because
      # neither toolchain can read the other's source. Same duplicate the watch
      # windows are, same loud-but-expensive failure: any drift makes every
      # record differ and costs a four-minute ACL2 run to discover. This asks
      # the same question in 20 ms, and drives BOTH sides separately plus the
      # WIDTH, because a gate that only checked names would pass a half-width
      # reading — the failure that silently halves the observation.
      - name: XMM record format agrees across the Lean/ACL2 boundary
        run: |
          python3 scripts/check_xmm_format.py --selftest
          python3 scripts/check_xmm_format.py

      # P1 BATCH 15 (D45): the watch windows are declared in BOTH Lean and the
      # ACL2 driver, because neither toolchain can read the other's source.
      # The drift fails loud — every record differs — but only after a
      # four-minute oracle run; this catches it in 20 ms.  `--selftest` mutates
      # each side's FIRST and LAST window, because the first version of the
      # parser silently read only the first and its selftest passed anyway.
      - name: Watch windows agree across the Lean/ACL2 boundary
        run: python3 scripts/check_windows.py --selftest

      # ── the roster gate (plan v1 §5: K's list is P1's fence) ─────────────
      # ⛔⛔ THIS NAME IS QUOTED, AND THE QUOTES ARE THE WHOLE REPAIR. Unquoted,
      # the bare `sparse: ` inside it is a YAML mapping key, and the FILE DOES NOT
      # PARSE — GitHub created ZERO jobs for it from `aa11e35` (09/02) to P2 vector
      # batch 1, forty-nine commits, and every run showed as an instant "failure"
      # that reads like a blip rather than an absence. See D88.
      - name: "Fetch the K semantics (sparse: `semantics/` only, 15 MB of 2.8 GB)"
        run: ./scripts/setup_k_roster.sh

      - name: P1 roster derivation selftest (13 SDM facts, driven red-first)
        run: python3 scripts/k_roster.py --selftest

      - name: P1 roster is DERIVED from K's tree, not written
        run: python3 scripts/k_roster.py --check

      # ⭐⭐ P2's roster is the JOIN of K's SIMD forms with the demand census,
      # and BOTH its inputs are in the repository -- K's tree, which the step
      # above already fetched, and the census's committed JSON. So unlike the
      # census (whose reading needs a downloaded corpus and can only be gated
      # for staleness), this document is re-derived byte-for-byte here.
      - name: P2 roster derivation selftest (the join, in both directions)
        run: python3 scripts/p2_roster.py --selftest

      - name: P2 roster is DERIVED from K + the census, not written
        run: python3 scripts/p2_roster.py --check

      # ⭐⭐⭐ P2 BATCH 34 (D157). THE BUILDABLE RESIDUE, AND THE SPLIT THAT SAYS
      # WHICH OF IT NEEDS A ROUNDING RULE. The queue asked for "the buildable
      # groups the census has surfaced" for three sittings and named none,
      # because the roster's ranked table shows its top forty rows and every
      # unclaimed row there is VEX or scalar FP. The residue is not blocked on
      # either: 24 of the 64 unclaimed SSE-legacy pairs that EXECUTE need no
      # rounding at all.
      #
      # ⛔ ITS THIRD GATE IS THE ONE TO KEEP. It re-derives the soft-float
      # commission's own PUBLISHED sub-group totals from the live census and
      # refuses if they move — the defect that commission's §2 records about
      # itself, where its price grew 44% while it sat docketed because the price
      # was a sentence and not a derived number. What it proves is that the
      # document and the census AGREE, not that either is right.
      - name: The buildable residue's rounding split, driven red-first
        run: |
          python3 scripts/p2_residue.py --selftest
          python3 scripts/p2_residue.py --check

      # ⭐⭐ D158. The batch-size price. The TIMING arms need a Lean toolchain and
      # are a local instrument (`--selftest`, `--calibrate`); what runs here is the
      # cheap half, and it is the half that would have caught the defect. The rule
      # this replaced was never a wrong measurement — it was PROSE, keyed to the
      # wrong quantity, sitting in the most-read planning doc and copied verbatim
      # into two banks because it read like arithmetic. Arm 3 makes the queue's own
      # law ("a price names the tool that prints it") enforceable for this price;
      # arms 1-2 fire if the budget line is renamed or the pinned literals move,
      # either of which would leave the sizing tool reading a default.
      - name: The vector batch-size price names its tool, and its inputs still parse
        run: |
          python3 scripts/p2_batch_size.py --check

      # ⭐⭐ P2 BATCH 12 (D105). The run-index CERTIFICATE that `vectorCoverage`
      # checks. Same discipline as the coverage table one step below, and for a
      # stronger reason: this file is IMPORTED BY THE MODEL TIER, so a stale one
      # does not merely publish a wrong number — it makes `Tests/Coverage.lean`
      # fail to build. ⛔ The generator imports `Tests.Vectors` and never
      # `Tests.Coverage`, so it can always be rebuilt to regenerate the file it
      # invalidated; without that the pair would deadlock a fresh checkout.
      - name: Vector run-index certificate is GENERATED, not written
        run: |
          lake env .lake/build/bin/x86lean-diff runs Tests/VectorRuns.lean
          git diff --exit-code Tests/VectorRuns.lean \
            || { echo "⛔ Tests/VectorRuns.lean is stale — regenerate it with"; \
                 echo "   lake exe x86lean-diff runs Tests/VectorRuns.lean"; exit 1; }

      - name: Coverage table is GENERATED, not written
        run: |
          lake env .lake/build/bin/x86lean-diff coverage docs/COVERAGE.md
          git diff --exit-code docs/COVERAGE.md \
            || { echo "⛔ docs/COVERAGE.md is stale — regenerate it with"; \
                 echo "   lake exe x86lean-diff coverage docs/COVERAGE.md"; exit 1; }

      # P1 BATCH 19 (D56, D57, D58): the coverage NUMBERS, derived rather than
      # asserted. They were a hand-maintained literal for eighteen batches — a
      # running sum of eighteen `awk` rules that nothing had ever checked
      # partition the roster — and the literal was ELEVEN LOW. This derives the
      # claim from the vectors' own assembly text and the roster rows' own
      # encodings, two sources neither of which comes from the other, and gates
      # all six published numbers against it.
      #
      # ⛔ `--selftest` breaks the two halves SEPARATELY (the resolver, then the
      # comparison) and breaks the comparison in BOTH DIRECTIONS. A gate that
      # fired only on over-claims would have passed this repository for eighteen
      # batches, because the defect it exists to catch was an under-claim.
      - name: Coverage numbers are DERIVED from the vectors and the roster
        run: |
          python3 scripts/claimed_forms.py --selftest
          python3 scripts/claimed_forms.py --check

  # ⭐⭐⭐ THE HARNESS SELFTEST, SHARDED.  Ninety arms over 825 vectors at ~2.6 min
  # per arm is hours, and BOTH numbers grow every batch — it was the dominant
  # cost of this workflow and the reason the first real run took most of a
  # morning.  The arms are independent by construction, so this parallelises
  # perfectly.
  #
  # ⛔ NO ARM IS TRIMMED TO BUY TIME.  Every arm still runs on every push; they
  # merely run beside each other.  Which arms belong to which shard is computed
  # by the binary from `selftestArms.length`, never written down here, so adding
  # an arm cannot leave it uncovered — and the `Shard partition gate` step in the
  # `build` job proves shards 1..6 name every arm exactly once.
  #
  # ⚠️ THE `6` APPEARS TWICE — in `matrix.shard` and in the command — and
  # `scripts/check_ci_shards.py` is what holds those two to each other. A matrix
  # shorter than the divisor would silently stop running whole residue classes of
  # arms, which is exactly the failure this gate exists to prevent.
  selftest:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
      - name: Build the differential executable
        run: lake build x86lean-diff
      - name: "Harness selftest shard ${{ matrix.shard }} of 6"
        run: lake env .lake/build/bin/x86lean-diff selftest-shard ${{ matrix.shard }} 6

  # ⭐⭐⭐ THE KERNEL-TIME DELTA GATE (D123), REGISTERED HERE BY THE HELM'S RULING
  # OF 2026-09-04 21:42: *"the absolute ceilings are retired as a MERGE GATE …
  # D111's delta method is the gate — you set the per-batch delta budget from
  # your own batch history, register it in the repo's CI as the check that runs,
  # red-first driven."*
  #
  # ⛔⛔ AND IT IS HERE FOR A REASON THE COMMENT AT THE TOP OF THIS FILE SPENDS
  # THIRTY LINES REFUSING TO PUT `kernel_cost.py` HERE.  That refusal is correct
  # and it is UNCHANGED: absolute millisecond ceilings are calibrated on one
  # machine, and the same tree profiled on this runner reads 1.7x-3.1x slower
  # DEPENDING ON THE MODULE, so no single calibration constant exists.
  #
  # ⇒ 🔑 THE VERY MEASUREMENT THAT REFUTES A PORTABLE CEILING IS WHAT MAKES A
  # PORTABLE RATIO WORK.  That factor is a property of (machine, unit).  This gate
  # profiles TWO TREES ON ONE MACHINE and gates the RATIO of the difference to the
  # base reading, so the factor appears in both numerator and denominator and
  # divides out exactly — whatever it is, and however much it varies between
  # modules.  `scripts/kernel_delta_budget.txt` is written in percentages for
  # precisely that reason, with an absolute `@floor` for the modules too small
  # for a ratio to mean anything.
  #
  # ⚠️ THAT IS A PREDICTION AND THE FIRST RUN HERE IS ITS TEST, NOT ITS CONFIRMATION.
  # This account's runner refuses every job for billing (desk FH), so no delta has
  # ever been measured on any machine but the developer box.  Compare the first
  # green here against `docs/DECISIONS.md` D123's local table before believing the
  # portability claim; a percentage that reads the same on two machines is the
  # evidence, and until then it is an argument.
  #
  # ⚠️ `fetch-depth: 0` IS LOAD-BEARING.  The gate profiles the change's BASE, and
  # `actions/checkout`'s default shallow clone has no parent commit to check out —
  # the gate would refuse (it does not invent a base), and a refusal every run is
  # a gate nobody reads.
  kernel-delta:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false

      # ⭐ THE COMPARISON'S OWN RED-FIRST DRIVE, AND IT RUNS FIRST so that a gate
      # which has stopped comparing cannot report a pass on the step below. It
      # carries no measurement at all — synthetic readings and planted budget
      # files — and it SAYS SO in its own output rather than leaving a reader to
      # assume otherwise.
      # ⛔ NO ARM COUNT IN THIS NAME.  The step above it carried "seven planted
      # bugs" for seven batches while there were thirty-eight (D41): a number in
      # a label nothing derives is the thing that goes stale while the list stays
      # right. The command prints its own count.
      - name: Delta-gate comparison and budget file, driven red
        run: python3 scripts/kernel_delta.py --selftest

      # ⭐⭐ THE SECOND GATE'S OWN RED-FIRST DRIVE (D154). The drift gate judges a
      # WINDOW of landed batches against the SUM of the per-step budgets, and the
      # two ways that sum can be got wrong are both planted here: `k x one budget`
      # under-allows a growing window (30.8% of real cases) and over-allows a
      # shrinking one (12.3%), so there is an arm for each direction rather than
      # one for the direction that happens to be commoner.
      # ⛔ NO ARM COUNT IN THIS NAME — the command prints its own.
      - name: Drift-gate arithmetic and ledger, driven red
        run: python3 scripts/kernel_drift.py --selftest

      # ⭐ THE LEDGER IS DERIVED, AND THIS SAYS SO. Every backfilled allowance is
      # recomputed from the committed walk and required to match. Without it the
      # window's allowance is a hand-editable number in a data file, which is the
      # one thing the budget file's own history says not to ship.
      # ⚠️ It proves the file matches its derivation, never that the derivation is
      # right; the rule is printed at the check for that reason.
      # ⛔⛔ NAMED ONE WALK FILE BY LITERAL UNTIL 09/06 (D174), and it verified the
      # 11 rows tagged with THAT walk while printing "equal to the committed
      # ledger". The five rows the drift backfill added from four other walks were
      # derivable by nothing, and this step would never have grown to cover them:
      # a gate named by a literal stops seeing renamed work. `--verify-ledger-all`
      # follows each ROW's own `source` tag instead, so a walk added tomorrow is
      # covered without editing this file, and a row whose walk is GONE refuses.
      - name: Drift allowance ledger is DERIVED from the committed readings
        run: python3 scripts/kernel_drift.py --verify-ledger-all

      # ⭐⭐ THE LANDING RITUAL'S OWN GATE (D164). Everything above judges kernel
      # TIME; this one judges whether the ledger is still being KEPT, which is the
      # precondition every drift verdict rests on. `--no-ff` at merge is a
      # discipline, and a gate whose precondition is a discipline is switched off
      # by the first head who forgets — the only thing that would have reported
      # the resulting hole is the drift gate, which the hole disables.
      # ⛔ IT GATES ONE BUCKET — steps that change a `.lean` file — because that is
      # the count ORDINARY WORK DOES NOT MOVE. A docs commit grows the chain and
      # leaves this number alone; a batch landed without its row raises it by one
      # and goes red. Both directions refuse: slack in the ceiling is exactly
      # where the next unrecorded landing would hide.
      - name: The drift ledger is still being kept (the --no-ff landing ritual)
        run: python3 scripts/kernel_drift.py --gap

      # 2026-09-09, the helm's item. `kernel_delta_history.py` had NO callable
      # surface at all — 595 lines and not one arm — so its walk order had never
      # been tested by anything. `visit_order` is now a pure function with its own
      # arms, and the pair below is the deliverable: `--interleave` takes a
      # commit's repeats back to back, and `score_calibration_night.py --early` is
      # the one-sided form of the usability gate that ordering makes evaluable.
      # ⭐ DERIVED, NOT QUOTED, inside the second selftest: on the real night-3
      # readings the gate could first fire at reading 2 of 24 interleaved against
      # reading 14 under the default order — the same readings, arriving in a
      # different order. Both are build-free and read committed corpora only.
      - name: Walk order, and the early one-sided form of the usability gate
        run: |
          python3 scripts/kernel_delta_history.py --selftest
          python3 scripts/score_calibration_night.py --selftest

      # ⛔ THIS TOOL'S TEN ARMS HAD NEVER RUN IN CI (found 09/05). It prices the
      # repairs D153 chose between and now DELEGATES its verdict rule to the gate
      # (`kd.judge_delta`), so a divergence between the two would be a divergence
      # between what the repository merges on and what it prices — and nothing was
      # watching for it. "Not on the gate list" is where a red hides.
      - name: Delta repair pricing agrees with the gate it prices, driven red
        run: python3 scripts/delta_repair_price.py --selftest

      # ⭐ THE FREE NUMBER IN THE RULE, GATED (D141). `K_SIGMA` decides how far
      # from its budget a delta must sit before this gate will call it, and a
      # free number in a gate is the kind that gets chosen by what it says about
      # the commit in front of the chooser. This asserts the error rates the
      # gate's own docstring quotes — in BOTH directions, because a rule that
      # refused everything would satisfy every "false pass" bound for free, and
      # two of the seven bounds are liveness for exactly that reason. No tree is
      # profiled; it runs in ~22 s on the developer box.
      - name: The band's constant delivers the error rates its docstring claims
        run: python3 scripts/delta_band_calibration.py --check

      # ⭐ THE BUDGET FILE IS GENERATED, AND THIS IS WHAT SAYS SO. Same discipline
      # as the coverage table and the run-index certificate: re-derive it from the
      # committed readings and require byte equality, so a hand-edited allowance
      # cannot ride in under a generated header.
      # ⚠️ WHAT THIS PROVES AND WHAT IT DOES NOT: byte-for-byte re-derivation says
      # the file matches the script, never that the script is right. The rule it
      # applies is printed inside the file for that reason.
      - name: Delta budget is DERIVED from the committed readings, not written
        run: |
          python3 scripts/kernel_delta_history.py --register-budget /tmp/budget.txt \
            --readings docs/kernel-delta-history-2026-09-04.jsonl
          diff -u scripts/kernel_delta_budget.txt /tmp/budget.txt \
            || { echo "⛔ scripts/kernel_delta_budget.txt is not what its own"; \
                 echo "   derivation produces — regenerate it, do not edit it."; exit 1; }

      # ⚠️ REPEATS IS A PRICE, NOT A SETTING (D141). The refusal test is now a
      # band of K standard errors around the delta, and that band falls as
      # 1/sqrt(n) — so the number here is what this job is willing to SPEND to
      # get a verdict rather than a refusal. Two passes a side is the least a
      # noise estimate can be built from at all, and no box has yet been shown
      # to resolve this budget at two. Six is a guess about a runner nobody has
      # measured (this account's Actions refuse every job for billing, desk FH);
      # ⛔ THE FIRST RUN THAT COMPLETES HERE PRICES IT, and the number to read
      # off that run is the `~N repeats a side would decide it` line the gate
      # prints when it refuses. Raise this to what that line says; do not raise
      # the budget, which is the one move the gate forbids.
      - name: Kernel-time DELTA against this change's base (two trees, one machine)
        run: python3 scripts/kernel_delta.py --repeats 6

  # ⭐⭐ THE ARM THE HELM ASKED FOR BY NAME — *"a planted constructor that doubles
  # the delta must fail"* — in its own job because it needs FOUR builds and eight
  # profile passes and would otherwise double the gate's wall clock.
  #
  # It plants N real constructors into `PrefetchHint` (the one inductive in this
  # repository matched in exactly one place, so the plant compiles and its whole
  # cost lands in `X86.Syntax`) and requires the gate to go RED. Beside it runs
  # the NEGATIVE control that could invalidate every green this gate has ever
  # printed: base and head at the SAME commit, which must be CLEAN.
  kernel-delta-redfirst:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
      - name: Delta gate driven on real trees (identical-trees control + planted constructor)
        # ⛔ `--repeats 2` UNTIL 09/06 (D171), AND AT TWO THE NEGATIVE CONTROL IS
        # BLIND: the family-wise cut over 23 units is 16.9 estimated SEs, so the
        # smallest bias arm 1 could report is ~32x one pass's own spread. Measured
        # against the budget file on the real c61d7f5 readings: at two, 19 of the
        # 23 budgeted units are UNPOLICED (a bias bigger than their whole allowance
        # passes in silence); at four, 4.0 and 12 of 23. ⚠️ FOUR DOES NOT FIX IT —
        # it halves it, and the arm now NAMES the units it cannot police instead of
        # printing a bare tick over them. Some (X86Native, 68x) are unresolvable at
        # any repeat count this job can afford; that is D152's R = band/allowance.
        # PRICE, measured on this box: arm 1 at --repeats 4 is 2 worktree builds +
        # 8 profile passes = ~22 min, and the job runs `measure` twice, so ~45 min
        # against ~22 at two. That is the cost of the control being a control.
        run: python3 scripts/kernel_delta.py --selftest-measure --repeats 4
