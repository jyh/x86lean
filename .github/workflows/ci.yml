# THROWAWAY DRIVE (closed unmerged; never merges). This branch's ci.yml carries
# #144's exact concurrency block and one long job, so the drive exercises the
# same group string without running the matrix.
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-run-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  long:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ref=${{ github.ref }}"; sleep 1200
