name: CI

# Every check this repository can make without the ACL2 oracle.
#
# ⚠️ WHAT IS NOT HERE, SAID PLAINLY: the differential run against ACL2 x86isa.
# Certifying `projects/x86isa/top.cert` pulls in the `std`, `bitops` and `rtl`
# books and is far too long for a per-push job. It runs locally (see
# docs/ORACLE-SETUP.md) and its RESULT is recorded in the repository. A CI that
# pretended to run it would be a green tick for work it did not do.
#
# ⚠️ AND SO IS `scripts/oracle_availability.py` (P1 batch 21, D65), for the same
# reason and stated here rather than left to be noticed: it EXECUTES forms on
# the oracle, so it cannot run on a runner that has no oracle. It runs beside
# the differential — `scripts/run_differential.sh` invokes it first and stops on
# it — and it takes about six seconds, which is what makes running it every
# batch realistic. Naming it here is the point: an oracle-dependent gate that is
# not in this file is a gate somebody has to remember, and the list of those has
# exactly two entries.
#
# The runner is x86-64 on purpose: it is the same lane plan v1 §4.4's hardware
# co-simulation will need, and the developer machine is arm64.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false

      - name: Build everything (model, native tier, tests, executables)
        run: lake build X86 X86Native Tests x86lean-diff x86lean-axioms

      # ── the trust gates ──────────────────────────────────────────────────
      - name: Axiom allowlist over the model library
        run: ./scripts/axiom_gate.sh

      - name: Axiom gate RED-FIRST drive (the gate must be seen to fail)
        run: ./scripts/axiom_gate_selftest.sh

      - name: Native tier isolation
        run: ./scripts/check_tier_isolation.sh

      # ── the model gates ──────────────────────────────────────────────────
      - name: Encoding cross-check (every `Instr.len` against a real assembler)
        run: python3 scripts/check_encodings.py

      # ⛔ THIS STEP WAS NAMED "seven planted bugs" UNTIL P1 BATCH 14, when there
      # were thirty-eight. The banner the command PRINTS has been derived from
      # `selftestArms.length` since D29 caught exactly this drift one layer down;
      # the step NAME beside it was still a literal, and had been wrong for seven
      # batches. A number in a label nothing reads is D41's rule in the CI file.
      - name: Harness selftest (every planted bug caught, + control + undefined column)
        run: lake env .lake/build/bin/x86lean-diff selftest

      # ⭐ P1 SEAL (D68). Tests.Coverage is gated PER DECLARATION now, in absolute
      # milliseconds, because D62 proved the ROW is not its unit and every
      # refinement since batch 14 went into the margin instead of the
      # denominator. `--selftest` drives the four ways this gate could stop
      # looking — a declaration over, the tail over, a gated declaration that is
      # no longer in the profile, and declarations gated with no tail ceiling —
      # plus the control, and it runs FIRST so a stuck gate cannot report a pass.
      - name: Kernel-cost ceilings (red-first, then the reading)
        run: |
          python3 scripts/kernel_cost.py --selftest
          python3 scripts/kernel_cost.py

      # ⭐ P1 BATCH 21. `memDestSweep` and `vectorCoverage` check three claims
      # each in ONE kernel reduction, so the sweeps behind them are paid once
      # (37 900 -> 21 900 ms on Tests.Coverage). A conjunction is the shape that
      # can go silent in a way three theorems cannot, so each of the six
      # conjuncts is planted with a defect ALONE and required to report `false`,
      # with an unplanted positive control in the same run.
      - name: Shared-reduction red probe (6 conjuncts + control)
        run: ./scripts/sharing_redprobe.sh

      # ⭐⭐ P2 ITEM 1 (D70, D71, D72). Four theorems landed with the segment
      # base, and each of them is the kind that can be green because it is EMPTY
      # rather than because it is true: an AST walk with a `_ => []` default, a
      # canonicity sweep that bounds a NAMED departure from x86isa, and the
      # window claim the whole OBSERVABILITY of the batch rests on -- an address
      # outside the watched windows reads as zeros in both models and reports
      # agreement about nothing. Each is planted alone and required to report
      # `false`, with an unplanted positive control in the same run. 17 seconds.
      - name: Segment-base red probe (4 arms + control)
        run: ./scripts/segment_redprobe.sh

      # ⭐ P1 SEAL (D66). The demand-side census maps objdump mnemonics onto the
      # roster, and that mapping is where a coverage number inflates itself --
      # strip a suffix too eagerly and `movsbl` becomes the string move `movs`,
      # which the model HAS. The mapping and every line-level rule are driven
      # here; the census itself needs a corpus of downloaded binaries and runs
      # locally, so what CI gates is the instrument, not the reading.
      # ⭐ P1 SEAL (D66, D69). The census needs a corpus of downloaded binaries,
      # so CI gates the INSTRUMENT (the mapping arms) and the STALENESS of the
      # published reading — not the reading itself, which cannot be re-derived
      # here. The staleness check needs no corpus: it recomputes the model's
      # mnemonic identity and refuses if the document was generated against a
      # different one.
      # ⭐⭐ THE ASSEMBLY COLUMN CLASS (the Captain, 09/03 16:5x) added the
      # per-function hand-written/compiler split, its two routes, and the
      # ISA-extension buckets -- and the RED PROBE is what says the new arms can
      # fail: it breaks each rule in memory, one at a time, and requires the
      # selftest to go red. It writes nothing into the tree.
      - name: Demand-census mapping (109 arms) + staleness + red probe
        run: |
          python3 scripts/demand_census.py --selftest
          python3 scripts/demand_census.py --check
          python3 scripts/census_redprobe.py

      # ⭐ P1 SEAL (D67). The README's Lean example is an INVITATION -- a reader
      # copies it to find out whether this model is usable -- and the one that
      # shipped at the seal did not compile: `open X86` with no `import X86`.
      # The head that wrote it had just corrected three errors of exactly this
      # kind in the draft it replaced.
      - name: README lean blocks compile (+selftest)
        run: |
          python3 scripts/check_readme_lean.py --selftest
          python3 scripts/check_readme_lean.py

      # P1 BATCH 14 (D41): the per-batch narrative in the generated coverage
      # document, gated against the differential records — two artifacts that
      # are not maintained by the same edit.
      - name: Coverage prose names every batch that has a differential record
        run: python3 scripts/check_coverage_prose.py

      # P1 BATCH 16 (D48): every comment that cites a declaration by name and
      # file must be telling the truth. Three phantom citations were standing
      # when this was written, the oldest from batch 11 — each naming a gate
      # that would have been load-bearing if it existed. `--selftest` checks
      # BOTH directions: a phantom is caught, a real citation is not flagged.
      - name: Named cross-references in comments point at something real
        run: |
          python3 scripts/check_citations.py --selftest
          python3 scripts/check_citations.py

      # P1 BATCH 16 (D47): the README's headline numbers, gated against the
      # GENERATED coverage table and the per-batch differential records. They
      # had been stale for four batches — and the sentence beneath them said
      # they were "a snapshot", which is what made the staleness read as
      # design. `--selftest` mutates every claim AND one source, because a gate
      # that compared the README to itself would pass every README mutation.
      - name: README headline numbers agree with the generated coverage table
        run: |
          python3 scripts/check_readme_snapshot.py --selftest
          python3 scripts/check_readme_snapshot.py

      # ⭐⭐⭐ P2 VECTOR WAVE, BATCH 0. The record's sixteen `xmmN=` fields are
      # produced TWICE — by `Cpu.renderXmms` and by `x86l-xmms` — because
      # neither toolchain can read the other's source. Same duplicate the watch
      # windows are, same loud-but-expensive failure: any drift makes every
      # record differ and costs a four-minute ACL2 run to discover. This asks
      # the same question in 20 ms, and drives BOTH sides separately plus the
      # WIDTH, because a gate that only checked names would pass a half-width
      # reading — the failure that silently halves the observation.
      - name: XMM record format agrees across the Lean/ACL2 boundary
        run: |
          python3 scripts/check_xmm_format.py --selftest
          python3 scripts/check_xmm_format.py

      # P1 BATCH 15 (D45): the watch windows are declared in BOTH Lean and the
      # ACL2 driver, because neither toolchain can read the other's source.
      # The drift fails loud — every record differs — but only after a
      # four-minute oracle run; this catches it in 20 ms.  `--selftest` mutates
      # each side's FIRST and LAST window, because the first version of the
      # parser silently read only the first and its selftest passed anyway.
      - name: Watch windows agree across the Lean/ACL2 boundary
        run: python3 scripts/check_windows.py --selftest

      # ── the roster gate (plan v1 §5: K's list is P1's fence) ─────────────
      - name: Fetch the K semantics (sparse: `semantics/` only, 15 MB of 2.8 GB)
        run: ./scripts/setup_k_roster.sh

      - name: P1 roster derivation selftest (13 SDM facts, driven red-first)
        run: python3 scripts/k_roster.py --selftest

      - name: P1 roster is DERIVED from K's tree, not written
        run: python3 scripts/k_roster.py --check

      # ⭐⭐ P2's roster is the JOIN of K's SIMD forms with the demand census,
      # and BOTH its inputs are in the repository -- K's tree, which the step
      # above already fetched, and the census's committed JSON. So unlike the
      # census (whose reading needs a downloaded corpus and can only be gated
      # for staleness), this document is re-derived byte-for-byte here.
      - name: P2 roster derivation selftest (the join, in both directions)
        run: python3 scripts/p2_roster.py --selftest

      - name: P2 roster is DERIVED from K + the census, not written
        run: python3 scripts/p2_roster.py --check

      - name: Coverage table is GENERATED, not written
        run: |
          lake env .lake/build/bin/x86lean-diff coverage docs/COVERAGE.md
          git diff --exit-code docs/COVERAGE.md \
            || { echo "⛔ docs/COVERAGE.md is stale — regenerate it with"; \
                 echo "   lake exe x86lean-diff coverage docs/COVERAGE.md"; exit 1; }

      # P1 BATCH 19 (D56, D57, D58): the coverage NUMBERS, derived rather than
      # asserted. They were a hand-maintained literal for eighteen batches — a
      # running sum of eighteen `awk` rules that nothing had ever checked
      # partition the roster — and the literal was ELEVEN LOW. This derives the
      # claim from the vectors' own assembly text and the roster rows' own
      # encodings, two sources neither of which comes from the other, and gates
      # all six published numbers against it.
      #
      # ⛔ `--selftest` breaks the two halves SEPARATELY (the resolver, then the
      # comparison) and breaks the comparison in BOTH DIRECTIONS. A gate that
      # fired only on over-claims would have passed this repository for eighteen
      # batches, because the defect it exists to catch was an under-claim.
      - name: Coverage numbers are DERIVED from the vectors and the roster
        run: |
          python3 scripts/claimed_forms.py --selftest
          python3 scripts/claimed_forms.py --check
