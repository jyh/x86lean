name: Scrub

# COMMIT HYGIENE, ENFORCED BY CI (fleet law, ~/projects/claude/CLAUDE.md).
# x86lean is destined to be PUBLIC, so this gate is in place BEFORE any remote
# exists — which is the only time the strong form is cheap.
#
# ⭐ THIS REPO RUNS THE STRONG FORM: the FULL history, every push, unfiltered.
# salt and saltworks scan the push delta instead, and that is a ruling about
# THEIR histories (which carry session URLs the Captain accepted and declined to
# rewrite), not a weaker standard. x86lean's history has been clean since commit
# 1, so "no session trailer has EVER entered this history" is an invariant that
# can actually be asserted here — and an invariant is worth more than a
# difference, because it does not depend on knowing where the last scan stopped.
#
# The gate FAILS CLOSED: a scan resolving to zero commits reds rather than
# reporting success, and `--self-test` proves that before it is allowed to pass
# on a full one. `Co-Authored-By` is deliberately untouched.
on:
  push:
  # ⛔ AND `edited`, ADDED 2026-09-21 -- THE DAY THE FORGE-PROSE CHECK BECAME A
  #   *REQUIRED* STATUS CHECK. `pull_request` defaults to opened / synchronize /
  #   reopened, so the EDIT THAT FIXES A TITLE OR BODY FIRED NO RUN. While a red
  #   merged anyway that was a stale red; once required, it is a PR that sits
  #   BLOCKED after its author did exactly what the gate's own message said. With
  #   `edited`, saving the fix IS the event that re-reads the forge, on the same
  #   head sha -- and a body edited to BAD after a green no longer waits for the
  #   next push. `check_pr_descriptions.py` READS THIS LIST to choose the remedy it
  #   prints, and its self-test reds if `edited` is dropped: one fact, one owner.
  # The green arm is again this change's own PR: edit its body once and a Scrub
  #   run appears with event `pull_request`, no push.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the strong form needs the whole history
      - name: Gate self-test (must fail on an empty set before it may pass on a full one)
        run: python3 scripts/check_commit_trailers.py --self-test
      - name: Full history
        run: python3 scripts/check_commit_trailers.py --range HEAD

  # ─────────────────────────────────────────────────────────────────────────
  # PATHS INTO THE PRIVATE RECORD (council 2026-08-25, the firewall line).
  # ⛔ PORTED FROM salt 2026-09-09, SIX DAYS LATE, AND THE LATENESS IS THE POINT.
  # Row ES's routing said "push only after `check_private_paths.py --range` is
  # clean". The script did not exist in this repository — it exists in ten
  # sibling trees and none of them is x86lean — so all 188 commits and every push
  # went out with the gate ABSENT, not passing. A precondition naming a tool that
  # is not installed reads exactly like a precondition that is met.
  # On its first run it found 8 findings in the tree and 7 across the history.
  #
  # ⭐ THE THREE ARMS ARE salt's, AND THE REASON THERE ARE THREE IS salt's TOO: a
  # DELTA gate charges the commit that ADDS a private path and cannot charge the
  # tree for KEEPING one, nor history for keeping a violating MESSAGE. Measured
  # across the fleet on 08/29, residue survived a delta gate's own next green.
  #
  # ✅ x86lean's POSITION IS STRONGER THAN salt's AND IS STATED SO IT CAN BE
  # CHECKED: `--messages` reads 188 of 188 clean, so "no commit message in this
  # history has ever cited the private record" is an INVARIANT here, not a
  # difference; and `--tree` is green with an EMPTY baseline, where salt carries
  # four accepted July-era lines. No baseline file is written by this repo — the
  # tool offers `--write-baseline` and calls it "a reviewed act, not a fix", and
  # the five real sites were REPAIRED instead.
  # ⚠️ WHAT IS OWED AND IS NOT FIXED HERE: `--range <root>..HEAD` still reads 7,
  # because those paths entered in past commits and a delta gate reads diffs. The
  # tree no longer carries them. Whether that history is rewritten before
  # publication is the Captain's call — salt's own precedent (08/30) was ACCEPT
  # AND RECORD, NO REWRITE — and it is filed as a pre-publication item rather
  # than settled by the seat that found it.
  private-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate self-test (drives every FAIL path before any scan may pass)
        run: python3 scripts/check_private_paths.py --self-test
      # The subject gate (desk QA) rides THIS job: a commit subject is history,
      # so its miss is permanent, unlike a PR body, which is editable.
      - name: Subject gate self-test (desk QA)
        run: python3 scripts/check_pr_descriptions.py --self-test
      - name: Scan the pushed delta
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # ⛔ THE FALLBACK IS A CONTROL PATH. On a new branch or a first push
          # `BEFORE` is all-zeros, and reaching back a fixed number of commits
          # would scan PRE-REPAIR history and red permanently on findings this
          # repo has already fixed in the tree. Fall back to the tree arm, which
          # asks the question that actually matters for a push: is the tree clean?
          #
          # ⛔ A REACHABLE `BEFORE` IS NOT ENOUGH (2026-09-16, QUEUE SCRUB-ANCESTRY). This test used to be
          # existence alone, so a branch moved BACK to an ancestor, whose old tip survives on another fetched
          # ref, gave an EMPTY `BEFORE..HEAD`, and the gate's own empty-scan refusal turned red on clean
          # content. Now `BEFORE` must be an ANCESTOR of HEAD and not HEAD itself, which is salt's production
          # form (`merge-base --is-ancestor`, which subsumes existence). Anything else takes the tree arm.
          # Driven old-vs-new in a scratch repo before this landed:
          #   ordinary push     range (both)          equal sha        FAIL (old) -> tree (new)
          #   moved back        FAIL (old) -> tree    divergent        range(old) -> tree (new; --tree + --history cover it)
          #   unreachable/zero  tree (both)
          # and each clause was dropped once: without `!= HEAD` the equal-sha case fails again; with existence
          # in place of ancestry the moved-back case does.
          # ⚠️ THE PRIVATE-PATHS ARMS NEED NO DEFAULT-BRANCH LOOKUP. The subject gate below does, on the tree
          # branch only, because subjects are history and have no tree arm (desk QA).
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null \
             && [ "$BEFORE" != "$(git rev-parse HEAD)" ]; then
            python3 scripts/check_private_paths.py --range "$BEFORE..HEAD"
            python3 scripts/check_pr_descriptions.py --range "$BEFORE..HEAD"
          else
            echo "no usable BEFORE (absent, unreachable, not an ancestor of HEAD, or HEAD itself) — falling back to the tree arm, declared not silent"
            python3 scripts/check_private_paths.py --tree
            # The subject gate has no tree arm: subjects are history. It reads
            # what this branch adds over the default branch instead.
            DEF="${{ github.event.repository.default_branch }}"
            MB=$(git merge-base "origin/$DEF" HEAD)
            if [ "$MB" != "$(git rev-parse HEAD)" ]; then
              python3 scripts/check_pr_descriptions.py --range "$MB..HEAD"
            else
              echo "DECLARED: HEAD adds no commit over origin/$DEF; its subjects are --history's"
            fi
          fi
          # The branch name: a merge subject will quote it, and the forge
          # writes that subject where no hook runs.
          python3 scripts/check_pr_descriptions.py --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
      - name: Tree ratchet (residue the delta gate already fired on must not survive)
        run: python3 scripts/check_private_paths.py --tree
      - name: Message ratchet (a violating message must not launder into the next base)
        run: python3 scripts/check_private_paths.py --messages
      # ⭐⭐⭐ THE HISTORY RATCHET — the arm the other three cannot be, WIRED 2026-09-10 on the
      # helm's ruling (FLEET.md 48491666). DRIVEN, not argued: two commits pushed together,
      # commit 1 ADDS a private path and commit 2 REMOVES it -- `--range` rc 0 (the NET
      # DIFFERENCE has no such file), `--tree` rc 0 (the TREE has no such file), `--history`
      # FAIL naming the intermediate commit and the blob. The blob reaches a public remote
      # and every other gate is green.
      # ⛔ THE ARM HAS EXISTED HERE SINCE PUB-1 AND CI RAN IT ZERO TIMES. Its baseline was
      # committed at 64ecb39 (8 sites, 4 commits) and PUB-1 closed 2026-09-10, so nothing was
      # blocking this step except nobody having added it.
      # ⚠️ `fetch-depth: 0` above is load-bearing: the arm REFUSES a shallow clone by name
      # rather than walking a truncated history and reporting success.
      - name: Every commit subject against the accepted-debt baseline (desk QA)
        # Red in both directions: a subject carrying a refused word that the
        # owner has not accepted, and a baseline row history no longer carries.
        run: python3 scripts/check_pr_descriptions.py --history
      - name: History ratchet (what each commit INTRODUCED -- the arm --range cannot be)
        run: python3 scripts/check_private_paths.py --history

  pr-descriptions:
    name: no private-record path or session URL in PR titles/bodies (the forge-side prose)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    # PORTED FROM salt (desk MC, 2026-09-14). A PR's TITLE and BODY are not git
    # objects, so the arms above cannot see them, and they are the most-read
    # public prose on the repo page. On 09-14 a chat-session URL reached a salt
    # PR body with every arm green; x86lean had no forge-prose gate at all. This
    # job re-reads EVERY open PR on each run: private-record paths (the shapes
    # scripts/check_private_paths.py owns) and chat-session trailers/URLs (the
    # shapes scripts/check_commit_trailers.py owns), imported, never re-typed.
    # A finding never echoes the matched text: this log is public.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The gate proves it can fail before it is allowed to pass.
      - run: python3 scripts/check_pr_descriptions.py --self-test
      - name: scan every open PR's title and body via the forge API
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pr_descriptions.py --open
